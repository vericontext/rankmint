<!--
  Landing Page Template
  - Generates output/<slug>/index.html — the main entry point for each ranking.
  - Self-contained: single HTML file with inline ECharts, OG meta tags, share bar.
  - Storyteller MUST replace all DATA, CONFIG, and CONTENT sections with actual values.
  - Sections: Hero → Surprise Callout → Chart → Taxonomy → Find Yourself → Full Table → Methodology + Share
-->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title><!-- REPLACE: Index Name | RankMint --></title>
<!-- OG Meta Tags -->
<meta property="og:title" content="<!-- REPLACE: Index Name -->">
<meta property="og:description" content="<!-- REPLACE: One-line hook -->">
<meta property="og:image" content="card.png">
<meta property="og:url" content="<!-- REPLACE: canonical URL -->">
<meta property="og:type" content="article">
<meta property="og:site_name" content="RankMint">
<!-- Twitter Card -->
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="<!-- REPLACE: Index Name -->">
<meta name="twitter:description" content="<!-- REPLACE: One-line hook -->">
<meta name="twitter:image" content="card.png">
<!-- __ANALYTICS_SNIPPET__ -->
<script src="https://cdn.jsdelivr.net/npm/echarts@5/dist/echarts.min.js"></script>
<style>
  :root {
    --bg: #fafafa; --text: #1a1a2e; --muted: #888; --accent: #4682B4;
    --card-bg: #fff; --border: #eee;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); line-height: 1.6; }
  .container { max-width: 1200px; margin: 0 auto; padding: 0 20px; }

  /* Hero */
  .hero { text-align: center; padding: 60px 20px 40px; background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%); color: #fff; }
  .hero h1 { font-size: 2.2rem; margin-bottom: 12px; }
  .hero .hook { font-size: 1.1rem; color: #ccc; max-width: 600px; margin: 0 auto 24px; }
  .hero .counter { font-size: 3.5rem; font-weight: 900; color: #FFD700; }
  .hero .counter-label { font-size: 0.9rem; color: #aaa; margin-top: 4px; }

  /* Surprise Callout */
  .surprise { background: linear-gradient(135deg, #FFD700 0%, #FF6B6B 100%); color: #1a1a2e; padding: 32px;
    border-radius: 12px; margin: -30px auto 40px; max-width: 700px; position: relative; z-index: 1; box-shadow: 0 8px 32px rgba(0,0,0,0.15); }
  .surprise h2 { font-size: 1.2rem; margin-bottom: 8px; }
  .surprise p { font-size: 0.95rem; }

  /* CTA insertion point 1 */
  /* <!-- __CTA_SLOT_1__ --> */

  /* Chart Section */
  .chart-section { margin: 40px auto; }
  .chart-section h2 { font-size: 1.3rem; margin-bottom: 16px; }
  #main-chart { width: 100%; height: 500px; background: var(--card-bg); border-radius: 12px; box-shadow: 0 2px 12px rgba(0,0,0,0.06); }

  /* Taxonomy */
  .taxonomy { margin: 40px auto; }
  .taxonomy h2 { font-size: 1.3rem; margin-bottom: 20px; }
  .tax-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 20px; }
  .tax-card { background: var(--card-bg); border-radius: 12px; padding: 24px; box-shadow: 0 2px 12px rgba(0,0,0,0.06); }
  .tax-card h3 { font-size: 1rem; margin-bottom: 8px; color: var(--accent); }
  .tax-card p { font-size: 0.85rem; color: var(--muted); margin-bottom: 12px; }
  .tax-card table { width: 100%; border-collapse: collapse; font-size: 0.8rem; }
  .tax-card th, .tax-card td { padding: 6px 8px; text-align: left; border-bottom: 1px solid var(--border); }
  .tax-card th { color: var(--muted); font-weight: 600; }

  /* CTA insertion point 2 */
  /* <!-- __CTA_SLOT_2__ --> */

  /* Find Yourself */
  .find-yourself { margin: 40px auto; text-align: center; padding: 40px 20px; background: var(--card-bg); border-radius: 12px; box-shadow: 0 2px 12px rgba(0,0,0,0.06); }
  .find-yourself h2 { font-size: 1.3rem; margin-bottom: 16px; }
  .find-yourself select { padding: 10px 20px; font-size: 1rem; border: 2px solid var(--accent); border-radius: 8px; background: #fff; min-width: 250px; }
  .result-card { display: none; margin: 24px auto 0; max-width: 400px; padding: 24px; background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
    color: #fff; border-radius: 12px; text-align: center; }
  .result-card .rank { font-size: 3rem; font-weight: 900; color: #FFD700; }
  .result-card .name { font-size: 1.2rem; margin: 8px auto; }
  .result-card .score { font-size: 0.9rem; color: #aaa; }

  /* Full Table */
  .full-table { margin: 40px auto; }
  .full-table h2 { font-size: 1.3rem; margin-bottom: 12px; }
  .table-search { width: 100%; padding: 10px 16px; border: 1px solid var(--border); border-radius: 8px; font-size: 0.9rem; margin-bottom: 12px; }
  .full-table table { width: 100%; border-collapse: collapse; font-size: 0.85rem; background: var(--card-bg); border-radius: 8px; overflow: hidden; box-shadow: 0 2px 12px rgba(0,0,0,0.06); }
  .full-table th { background: #1a1a2e; color: #fff; padding: 10px 12px; text-align: left; cursor: pointer; user-select: none; }
  .full-table th:hover { background: #2d2d5e; }
  .full-table td { padding: 8px 12px; border-bottom: 1px solid var(--border); }
  .full-table tr:hover td { background: #f0f4ff; }

  /* Methodology */
  .methodology { margin: 40px auto; padding: 24px; background: var(--card-bg); border-radius: 12px; font-size: 0.85rem; color: var(--muted); }
  .methodology h2 { font-size: 1.1rem; color: var(--text); margin-bottom: 12px; }

  /* Share Bar */
  .share-bar { display: flex; justify-content: center; gap: 12px; padding: 30px 0; flex-wrap: wrap; }
  .share-btn { display: inline-flex; align-items: center; gap: 6px; padding: 10px 20px; border-radius: 8px;
    text-decoration: none; font-size: 0.85rem; font-weight: 600; color: #fff; transition: transform 0.2s; }
  .share-btn:hover { transform: translateY(-2px); }
  .share-twitter { background: #000; }
  .share-linkedin { background: #0A66C2; }
  .share-copy { background: #333; cursor: pointer; border: none; color: #fff; font-size: 0.85rem; font-weight: 600; }

  /* Sponsor Bar (hidden by default) */
  .sponsor-bar { display: none; text-align: center; padding: 12px; background: #f0f4ff; border-radius: 8px; margin: 20px auto; font-size: 0.8rem; color: var(--muted); }

  /* Footer */
  .footer { text-align: center; padding: 20px; color: var(--muted); font-size: 0.75rem; font-style: italic; }

  @media (max-width: 600px) {
    .hero h1 { font-size: 1.5rem; }
    .hero .counter { font-size: 2.5rem; }
    .tax-grid { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>

<!-- Top Navigation -->
<nav style="background:#1a1a2e;padding:10px 20px;display:flex;justify-content:space-between;align-items:center;">
  <a href="../" style="color:#FFD700;text-decoration:none;font-weight:600;font-size:0.9rem;">← RankMint Home</a>
  <span style="color:#666;font-size:0.75rem;">rankmint.io</span>
</nav>

<!-- Sponsor Bar (hidden by default — set display:block when sponsored) -->
<div class="sponsor-bar" id="sponsor"><!-- __SPONSOR_CONTENT__ --></div>

<!-- Hero -->
<section class="hero">
  <div class="container">
    <h1 id="hero-title"><!-- REPLACE: Index Name --></h1>
    <p class="hook" id="hero-hook"><!-- REPLACE: One-line hook --></p>
    <div class="counter" id="hero-counter">0</div>
    <div class="counter-label" id="hero-counter-label"><!-- REPLACE: e.g., "#1: Finland — 94.2 points" --></div>
  </div>
</section>

<!-- Surprise Callout -->
<section class="container">
  <div class="surprise">
    <h2 id="surprise-title"><!-- REPLACE: Surprise headline --></h2>
    <p id="surprise-body"><!-- REPLACE: 2-3 sentences explaining the counter-intuitive finding --></p>
  </div>
</section>

<!-- __CTA_SLOT_1__ -->

<!-- Chart -->
<section class="chart-section container">
  <h2>The Rankings</h2>
  <div id="main-chart"></div>
</section>

<!-- Taxonomy -->
<section class="taxonomy container">
  <h2>The Taxonomy</h2>
  <div class="tax-grid" id="tax-grid">
    <!-- REPLACE: Storyteller generates taxonomy cards here -->
    <!--
    <div class="tax-card">
      <h3>Category Name</h3>
      <p>Brief description of what unites this group.</p>
      <table>
        <tr><th>Rank</th><th>Name</th><th>Score</th></tr>
        <tr><td>1</td><td>Item A</td><td>94.2</td></tr>
      </table>
    </div>
    -->
  </div>
</section>

<!-- __CTA_SLOT_2__ -->

<!-- Find Yourself -->
<section class="find-yourself container" id="find-section">
  <h2>Find Yourself</h2>
  <select id="find-select">
    <option value="">-- Select an item --</option>
  </select>
  <div class="result-card" id="result-card">
    <div class="rank" id="result-rank"></div>
    <div class="name" id="result-name"></div>
    <div class="score" id="result-score"></div>
  </div>
</section>

<!-- Full Table -->
<section class="full-table container">
  <h2>Full Rankings</h2>
  <input type="text" class="table-search" id="table-search" placeholder="Search...">
  <table id="ranking-table">
    <thead id="table-head"></thead>
    <tbody id="table-body"></tbody>
  </table>
</section>

<!-- Methodology -->
<section class="methodology container" id="methodology">
  <!-- REPLACE: Storyteller fills methodology details -->
</section>

<!-- Share Bar -->
<div class="share-bar">
  <a class="share-btn share-twitter" id="share-twitter" href="#" target="_blank">Share on X</a>
  <a class="share-btn share-linkedin" id="share-linkedin" href="#" target="_blank">LinkedIn</a>
  <button class="share-btn share-copy" id="share-copy">Copy Link</button>
</div>

<!-- CTA insertion point 3 -->
<!-- __CTA_SLOT_3__ -->

<div class="footer">Generated by RankMint</div>

<script>
// ===== DATA — storyteller replaces this =====
const DATA = [
  // { rank: 1, name: "Item A", score: 94.2, metric1: 80, metric2: 95 },
];

// ===== CONFIG — storyteller customizes these =====
const CONFIG = {
  title: "Index Name",
  hook: "One-line hook",
  nameField: "name",
  scoreField: "score",
  topN: 15,
  // Columns to show in full table (in order)
  tableColumns: ["rank", "name", "score"],
  tableHeaders: ["Rank", "Name", "Score"],
  // Chart type: "bar" | "tier" | "radar"
  chartType: "bar",
  palette: "gold-steel",
  // Counter animation target (typically #1 score)
  counterTarget: 94.2,
  counterLabel: '#1: Item A — 94.2 points',
  // Share URL
  shareUrl: "",
  shareText: "",
};

const PALETTES = {
  "gold-steel": ["#FFD700", "#4682B4"],
  "sunset":     ["#FF6B6B", "#6B2FA0"],
  "forest":     ["#A8E06C", "#1B5E20"],
  "ocean":      ["#00E5FF", "#0D47A1"],
  "berry":      ["#E91E63", "#4A148C"],
  "ember":      ["#FF9800", "#BF360C"],
};

function interpolateColor(c1, c2, t) {
  const hex = s => parseInt(s, 16);
  const r = Math.round(hex(c1.slice(1,3)) + (hex(c2.slice(1,3)) - hex(c1.slice(1,3))) * t);
  const g = Math.round(hex(c1.slice(3,5)) + (hex(c2.slice(3,5)) - hex(c1.slice(3,5))) * t);
  const b = Math.round(hex(c1.slice(5,7)) + (hex(c2.slice(5,7)) - hex(c1.slice(5,7))) * t);
  return `rgb(${r},${g},${b})`;
}

// ===== Counter Animation =====
const counterEl = document.getElementById("hero-counter");
let count = 0;
const target = CONFIG.counterTarget;
const step = target / 60;
function animateCounter() {
  count += step;
  if (count >= target) { counterEl.textContent = target.toFixed(1); return; }
  counterEl.textContent = count.toFixed(1);
  requestAnimationFrame(animateCounter);
}
animateCounter();

// ===== Bar Chart =====
if (CONFIG.chartType === "bar") {
  const sorted = [...DATA].sort((a, b) => b[CONFIG.scoreField] - a[CONFIG.scoreField]).slice(0, CONFIG.topN);
  const names = sorted.map(d => d[CONFIG.nameField]).reverse();
  const scores = sorted.map(d => d[CONFIG.scoreField]).reverse();
  const [c1, c2] = PALETTES[CONFIG.palette] || PALETTES["gold-steel"];
  const colors = scores.map((_, i) => interpolateColor(c2, c1, i / Math.max(scores.length - 1, 1)));

  const chart = echarts.init(document.getElementById("main-chart"));
  chart.setOption({
    tooltip: { trigger: "axis", axisPointer: { type: "shadow" } },
    grid: { left: "22%", right: "10%", top: 20, bottom: 30 },
    xAxis: { type: "value", max: Math.ceil(Math.max(...scores) * 1.1) },
    yAxis: { type: "category", data: names, axisLabel: { fontSize: 12 } },
    dataZoom: [{ type: "inside", yAxisIndex: 0, filterMode: "none" }],
    series: [{
      type: "bar",
      data: scores.map((v, i) => ({ value: v, itemStyle: { color: colors[i] } })),
      barWidth: "60%",
      label: { show: true, position: "right", formatter: "{c}", fontSize: 11 },
      animationDuration: 1500, animationEasing: "elasticOut",
    }],
    graphic: [{ type: "text", right: 20, bottom: 10, style: { text: "RankMint", fontSize: 12, fill: "#ccc", fontStyle: "italic" } }],
  });

  // Find Yourself: highlight on chart
  const findSelect = document.getElementById("find-select");
  DATA.forEach(d => {
    const opt = document.createElement("option");
    opt.value = d[CONFIG.nameField]; opt.textContent = d[CONFIG.nameField];
    findSelect.appendChild(opt);
  });
  findSelect.addEventListener("change", () => {
    const selected = DATA.find(d => d[CONFIG.nameField] === findSelect.value);
    if (!selected) { document.getElementById("result-card").style.display = "none"; return; }
    document.getElementById("result-card").style.display = "block";
    document.getElementById("result-rank").textContent = `#${selected.rank || DATA.indexOf(selected) + 1}`;
    document.getElementById("result-name").textContent = selected[CONFIG.nameField];
    document.getElementById("result-score").textContent = `Score: ${selected[CONFIG.scoreField].toFixed(1)}`;
    // Highlight on chart
    const idx = names.indexOf(selected[CONFIG.nameField]);
    if (idx >= 0) {
      chart.dispatchAction({ type: "highlight", seriesIndex: 0, dataIndex: idx });
      chart.dispatchAction({ type: "showTip", seriesIndex: 0, dataIndex: idx });
    }
  });
  window.addEventListener("resize", () => chart.resize());
}

// ===== Full Table =====
const thead = document.getElementById("table-head");
const tbody = document.getElementById("table-body");
const headerRow = document.createElement("tr");
CONFIG.tableHeaders.forEach((h, i) => {
  const th = document.createElement("th");
  th.textContent = h;
  th.addEventListener("click", () => sortTable(i));
  headerRow.appendChild(th);
});
thead.appendChild(headerRow);

let tableData = [...DATA].sort((a, b) => (a.rank || 0) - (b.rank || 0));
function renderTable(data) {
  tbody.innerHTML = "";
  data.forEach(d => {
    const tr = document.createElement("tr");
    CONFIG.tableColumns.forEach(col => {
      const td = document.createElement("td");
      const v = d[col];
      td.textContent = typeof v === "number" ? (v % 1 === 0 ? v : v.toFixed(1)) : v;
      tr.appendChild(td);
    });
    tbody.appendChild(tr);
  });
}
renderTable(tableData);

let sortDir = {};
function sortTable(colIdx) {
  const col = CONFIG.tableColumns[colIdx];
  sortDir[col] = !(sortDir[col] || false);
  tableData.sort((a, b) => {
    const va = a[col], vb = b[col];
    const cmp = typeof va === "number" ? va - vb : String(va).localeCompare(String(vb));
    return sortDir[col] ? cmp : -cmp;
  });
  renderTable(tableData);
}

document.getElementById("table-search").addEventListener("input", e => {
  const q = e.target.value.toLowerCase();
  renderTable(tableData.filter(d => Object.values(d).some(v => String(v).toLowerCase().includes(q))));
});

// ===== Share =====
const url = CONFIG.shareUrl || window.location.href;
const text = CONFIG.shareText || CONFIG.hook;
document.getElementById("share-twitter").href = `https://x.com/intent/post?text=${encodeURIComponent(text)}&url=${encodeURIComponent(url)}`;
document.getElementById("share-linkedin").href = `https://www.linkedin.com/sharing/share-offsite/?url=${encodeURIComponent(url)}`;
document.getElementById("share-copy").addEventListener("click", () => {
  navigator.clipboard.writeText(url).then(() => {
    document.getElementById("share-copy").textContent = "Copied!";
    setTimeout(() => document.getElementById("share-copy").textContent = "Copy Link", 2000);
  });
});
</script>
</body>
</html>
