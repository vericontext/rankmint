<!--
  Email Gate Template
  - Shows top 5 items publicly, gates the rest behind email capture.
  - Storyteller generates this as output/<slug>/gate.html (optional).
  - Self-contained HTML with inline form.
-->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title><!-- REPLACE: Index Name | RankMint --></title>
<meta property="og:title" content="<!-- REPLACE: Index Name -->">
<meta property="og:description" content="<!-- REPLACE: One-line hook -->">
<meta property="og:image" content="card.png">
<meta property="og:type" content="article">
<!-- __ANALYTICS_SNIPPET__ -->
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #fafafa; color: #1a1a2e; }
  .container { max-width: 700px; margin: 0 auto; padding: 40px 20px; }
  h1 { font-size: 1.6rem; margin-bottom: 8px; }
  .hook { color: #888; font-size: 0.95rem; margin-bottom: 32px; }
  .table-preview table { width: 100%; border-collapse: collapse; margin-bottom: 0; }
  .table-preview th { background: #1a1a2e; color: #fff; padding: 10px 12px; text-align: left; }
  .table-preview td { padding: 10px 12px; border-bottom: 1px solid #eee; }
  .gate-overlay {
    position: relative; margin-top: -2px;
    background: linear-gradient(180deg, rgba(250,250,250,0) 0%, rgba(250,250,250,1) 60%);
    padding: 80px 20px 40px; text-align: center;
  }
  .gate-overlay h2 { font-size: 1.2rem; margin-bottom: 8px; }
  .gate-overlay p { color: #888; font-size: 0.9rem; margin-bottom: 20px; }
  .gate-form { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }
  .gate-form input[type="email"] { padding: 10px 16px; border: 2px solid #4682B4; border-radius: 8px; font-size: 0.9rem; min-width: 250px; }
  .gate-form button { padding: 10px 24px; background: #4682B4; color: #fff; border: none; border-radius: 8px; font-size: 0.9rem; font-weight: 600; cursor: pointer; }
  .gate-form button:hover { background: #3a6f9a; }
  .hidden-table { display: none; }
  .footer { text-align: center; padding: 20px; color: #aaa; font-size: 0.75rem; font-style: italic; margin-top: 40px; }
</style>
</head>
<body>
<div class="container">
  <h1><!-- REPLACE: Index Name --></h1>
  <p class="hook"><!-- REPLACE: One-line hook --></p>

  <!-- Visible: Top 5 -->
  <div class="table-preview">
    <table>
      <thead>
        <tr>
          <th>Rank</th><th>Name</th><th>Score</th>
        </tr>
      </thead>
      <tbody id="preview-body">
        <!-- REPLACE: Top 5 rows -->
      </tbody>
    </table>
  </div>

  <!-- Gate -->
  <div class="gate-overlay" id="gate">
    <h2>See the full ranking</h2>
    <p>Enter your email to unlock all results + get future rankings.</p>
    <div class="gate-form">
      <input type="email" id="gate-email" placeholder="your@email.com">
      <button id="gate-btn">Unlock</button>
    </div>
  </div>

  <!-- Hidden: Full table (revealed after email) -->
  <div class="hidden-table" id="full-table">
    <table style="width:100%;border-collapse:collapse;">
      <thead>
        <tr>
          <th style="background:#1a1a2e;color:#fff;padding:10px 12px;text-align:left;">Rank</th>
          <th style="background:#1a1a2e;color:#fff;padding:10px 12px;text-align:left;">Name</th>
          <th style="background:#1a1a2e;color:#fff;padding:10px 12px;text-align:left;">Score</th>
        </tr>
      </thead>
      <tbody id="full-body">
        <!-- REPLACE: All rows -->
      </tbody>
    </table>
  </div>

  <div class="footer">Generated by RankMint</div>
</div>

<script>
document.getElementById("gate-btn").addEventListener("click", () => {
  const email = document.getElementById("gate-email").value;
  if (!email || !email.includes("@")) { alert("Please enter a valid email."); return; }
  // In production, POST email to your backend/service here.
  // For now, just reveal the table.
  document.getElementById("gate").style.display = "none";
  document.getElementById("full-table").style.display = "block";
  document.querySelector(".table-preview").style.display = "none";
});
</script>
</body>
</html>
