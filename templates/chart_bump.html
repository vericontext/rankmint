<!--
  Bump Chart Template (ECharts)
  - Shows how items shift rank across different metrics.
  - Best for: "this item is #1 in X but #25 in Y" — rank position lines.
  - Self-contained: single HTML file, only external dependency is ECharts CDN.
  - Storyteller MUST replace the DATA and CONFIG sections below with actual values.
-->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title><!-- REPLACE: Chart Title --></title>
<meta property="og:title" content="<!-- REPLACE: Chart Title -->">
<meta property="og:description" content="<!-- REPLACE: One-line hook -->">
<meta property="og:image" content="card.png">
<meta property="og:type" content="article">
<meta property="og:site_name" content="RankMint">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="<!-- REPLACE: Chart Title -->">
<meta name="twitter:description" content="<!-- REPLACE: One-line hook -->">
<meta name="twitter:image" content="card.png">
<!-- Google tag (gtag.js) -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-L8PE9R1YX4"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());
  gtag('config', 'G-L8PE9R1YX4');
</script>
<script src="https://cdn.jsdelivr.net/npm/echarts@5/dist/echarts.min.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #fafafa; }
  #chart { width: 100%; height: 85vh; min-height: 650px; }
  .header { padding: 24px 32px 8px; }
  .header h1 { font-size: 1.4rem; color: #1a1a2e; }
  .header p { font-size: 0.85rem; color: #888; margin-top: 4px; }
  .controls { padding: 8px 32px; display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }
  .controls label { font-size: 0.85rem; color: #666; }
  .controls select { padding: 6px 12px; border: 1px solid #ddd; border-radius: 6px; font-size: 0.85rem; }
  .legend { padding: 4px 32px; font-size: 0.8rem; color: #888; }
</style>
</head>
<body>
<!-- Navigation -->
<nav style="padding:10px 20px;display:flex;gap:16px;align-items:center;">
  <a href="../" style="color:#4682B4;text-decoration:none;font-size:0.85rem;">← RankMint Home</a>
  <a href="index.html" style="color:#4682B4;text-decoration:none;font-size:0.85rem;">← Back to Rankings</a>
</nav>
<div class="header">
  <h1><!-- REPLACE: Chart Title --></h1>
  <p><!-- REPLACE: Subtitle / source note --></p>
</div>
<div class="controls">
  <label>Highlight:</label>
  <select id="highlight">
    <option value="">All items</option>
  </select>
</div>
<div id="chart"></div>
<script>
// ===== DATA — storyteller replaces this =====
const DATA = [
  // { name: "Item A", metric1: 80, metric2: 70, metric3: 90, score: 85 },
];

// ===== CONFIG — storyteller customizes these =====
const CONFIG = {
  title: "Bump Chart",
  nameField: "name",
  scoreField: "score",
  // Metrics as columns — items are ranked within each metric
  metrics: ["metric1", "metric2", "metric3"],
  metricLabels: ["Metric 1", "Metric 2", "Metric 3"],
  // Number of top items to show (rest are dimmed)
  topN: 15,
  palette: "gold-steel",
};

// ===== RENDERING (do not modify) =====
const PALETTES = {
  "gold-steel": ["#FFD700","#4682B4","#FF6B6B","#6BCB77","#9B59B6","#E67E22","#1ABC9C","#E74C3C","#3498DB","#F39C12","#2ECC71","#E91E63","#00BCD4","#FF5722","#607D8B"],
  "sunset":     ["#FF6B6B","#6B2FA0","#FF9F43","#EE5A24","#BE2EDD","#F368E0","#FF6348","#C44569","#574B90","#303952","#E66767","#CF6A87","#786FA6","#F8A5C2","#63CDDA"],
  "forest":     ["#A8E06C","#1B5E20","#4CAF50","#81C784","#388E3C","#00695C","#2E7D32","#558B2F","#33691E","#004D40","#00796B","#689F38","#7CB342","#8BC34A","#CDDC39"],
  "ocean":      ["#00E5FF","#0D47A1","#42A5F5","#1565C0","#0277BD","#00838F","#006064","#01579B","#0288D1","#039BE5","#03A9F4","#29B6F6","#4FC3F7","#81D4FA","#B3E5FC"],
  "berry":      ["#E91E63","#4A148C","#9C27B0","#7B1FA2","#6A1B9A","#AD1457","#C2185B","#D81B60","#F06292","#CE93D8","#BA68C8","#AB47BC","#8E24AA","#AA00FF","#EA80FC"],
  "ember":      ["#FF9800","#BF360C","#F57C00","#E65100","#FF5722","#DD2C00","#FF6E40","#FF3D00","#D84315","#4E342E","#5D4037","#6D4C41","#795548","#8D6E63","#BCAAA4"],
};

const sorted = [...DATA].sort((a, b) => b[CONFIG.scoreField] - a[CONFIG.scoreField]).slice(0, CONFIG.topN);
const colors = PALETTES[CONFIG.palette] || PALETTES["gold-steel"];

// Compute ranks for each metric
const ranks = {};
CONFIG.metrics.forEach(m => {
  const byMetric = [...sorted].sort((a, b) => b[m] - a[m]);
  ranks[m] = {};
  byMetric.forEach((d, i) => { ranks[m][d[CONFIG.nameField]] = i + 1; });
});

// Populate highlight dropdown
const highlightSel = document.getElementById("highlight");
sorted.forEach(d => {
  const opt = document.createElement("option");
  opt.value = d[CONFIG.nameField];
  opt.textContent = d[CONFIG.nameField];
  highlightSel.appendChild(opt);
});

const chart = echarts.init(document.getElementById("chart"));

function render(highlightName) {
  const series = sorted.map((d, idx) => {
    const name = d[CONFIG.nameField];
    const isHighlighted = !highlightName || highlightName === name;
    return {
      name: name,
      type: "line",
      data: CONFIG.metrics.map(m => ranks[m][name]),
      lineStyle: {
        width: isHighlighted ? 3 : 1,
        opacity: isHighlighted ? 1 : 0.15,
        color: colors[idx % colors.length],
      },
      itemStyle: {
        color: colors[idx % colors.length],
        opacity: isHighlighted ? 1 : 0.15,
      },
      symbol: "circle",
      symbolSize: isHighlighted ? 10 : 4,
      label: {
        show: isHighlighted && CONFIG.metrics.length > 0,
        position: "right",
        formatter: p => p.dataIndex === CONFIG.metrics.length - 1 ? name : "",
        fontSize: 11,
        color: colors[idx % colors.length],
      },
      emphasis: {
        lineStyle: { width: 4, opacity: 1 },
        itemStyle: { opacity: 1 },
      },
      z: isHighlighted ? 10 : 1,
      animationDuration: 1500,
      animationEasing: "cubicOut",
    };
  });

  chart.setOption({
    tooltip: {
      trigger: "item",
      formatter: p => {
        const d = sorted.find(x => x[CONFIG.nameField] === p.seriesName);
        if (!d) return "";
        const metricIdx = p.dataIndex;
        const metric = CONFIG.metricLabels[metricIdx] || CONFIG.metrics[metricIdx];
        return `<b>${p.seriesName}</b><br/>${metric} rank: #${p.value}<br/>Raw value: ${d[CONFIG.metrics[metricIdx]]}<br/>Overall score: ${d[CONFIG.scoreField].toFixed(1)}`;
      },
    },
    grid: { left: "8%", right: "15%", top: 40, bottom: 40 },
    xAxis: {
      type: "category",
      data: CONFIG.metricLabels.length ? CONFIG.metricLabels : CONFIG.metrics,
      axisLabel: { fontSize: 12 },
      axisTick: { alignWithLabel: true },
    },
    yAxis: {
      type: "value",
      inverse: true,
      min: 1,
      max: sorted.length,
      name: "Rank",
      nameLocation: "center",
      nameGap: 40,
      axisLabel: { formatter: "#{value}" },
    },
    series: series,
    graphic: [{
      type: "text", right: 20, bottom: 10,
      style: { text: "RankMint", fontSize: 12, fill: "#ccc", fontStyle: "italic" },
    }],
  }, true);
}

highlightSel.addEventListener("change", () => render(highlightSel.value));
render("");
window.addEventListener("resize", () => chart.resize());
</script>
</body>
</html>
