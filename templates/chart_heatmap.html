  Heatmap Chart Template (ECharts)

  - Best for: items × metrics grid — lets data enthusiasts find their item quickly.
  - Self-contained: single HTML file, only external dependency is ECharts CDN.
  - Storyteller MUST replace the DATA and CONFIG sections below with actual values.
-->

<html lang="en">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<script src="https://cdn.jsdelivr.net/npm/echarts@5/dist/echarts.min.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #fafafa; }
  #chart { width: 100%; height: 90vh; min-height: 700px; }
  .header { padding: 24px 32px 8px; }

  .header p { font-size: 0.85rem; color: #888; margin-top: 4px; }
</style>

<body>
<!-- Navigation -->
<nav style="padding:10px 20px;display:flex;gap:16px;align-items:center;">
  <a href="../" style="color:#4682B4;text-decoration:none;font-size:0.85rem;">← RankMint Home</a>
  <a href="index.html" style="color:#4682B4;text-decoration:none;font-size:0.85rem;">← Back to Rankings</a>
</nav>
<div class="header">
  <h1><!-- REPLACE: Chart Title --></h1>
  <p><!-- REPLACE: Subtitle / source note --></p>
</div>
<div id="chart"></div>
<script>
// ===== DATA — storyteller replaces this =====
const DATA = [
  // { name: "Item A", metric1: 80, metric2: 70, metric3: 90, score: 85 },
];

// ===== CONFIG — storyteller customizes these =====
const CONFIG = {
  title: "Heatmap",
  nameField: "name",
  scoreField: "score",
  // Metrics to display as columns (in order)
  metrics: ["metric1", "metric2", "metric3"],
  metricLabels: ["Metric 1", "Metric 2", "Metric 3"],
  // Color range: low → high
  colorRange: ["#313695", "#4575b4", "#74add1", "#abd9e9", "#fee090", "#fdae61", "#f46d43", "#d73027"],
};

// ===== RENDERING (do not modify) =====
const sorted = [...DATA].sort((a, b) => b[CONFIG.scoreField] - a[CONFIG.scoreField]);
const names = sorted.map(d => d[CONFIG.nameField]);
const metrics = CONFIG.metrics;
const labels = CONFIG.metricLabels.length ? CONFIG.metricLabels : metrics;

// Normalize each metric to 0-100 for color mapping
const normData = [];
const ranges = {};
metrics.forEach(m => {
  const vals = sorted.map(d => d[m]);
  ranges[m] = { min: Math.min(...vals), max: Math.max(...vals) };
});

const heatData = [];
sorted.forEach((d, yi) => {
  metrics.forEach((m, xi) => {
    const raw = d[m];
    const { min, max } = ranges[m];
    const norm = max - min > 0 ? ((raw - min) / (max - min)) * 100 : 50;
    heatData.push([xi, yi, norm, raw]);
  });
});

const chart = echarts.init(document.getElementById("chart"));
chart.setOption({
  tooltip: {
    position: "top",
    formatter: p => {
      const d = sorted[p.value[1]];
      const metric = labels[p.value[0]];
      return `<b>${d[CONFIG.nameField]}</b><br/>${metric}: ${p.value[3]}<br/>Score: ${d[CONFIG.scoreField].toFixed(1)}`;
    },
  },
  grid: { left: "20%", right: "8%", top: 60, bottom: 40 },
  xAxis: {
    type: "category", data: labels, position: "top",
    axisLabel: { fontSize: 11, rotate: 30 },
    splitArea: { show: true },
  },
  yAxis: {
    type: "category", data: names, inverse: false,
    axisLabel: { fontSize: 11 },
    splitArea: { show: true },
  },
  visualMap: {
    min: 0, max: 100, calculable: true,
    orient: "horizontal", left: "center", top: 10,
    inRange: { color: CONFIG.colorRange },
    text: ["High", "Low"],
    textStyle: { fontSize: 11 },
  },
  dataZoom: [
    { type: "inside", yAxisIndex: 0, filterMode: "none" },
  ],
  series: [{
    type: "heatmap",
    data: heatData,
    label: {
      show: true,
      formatter: p => {
        const raw = p.value[3];
        return typeof raw === "number" ? (raw % 1 === 0 ? raw : raw.toFixed(1)) : raw;
      },
      fontSize: 10,
    },
    emphasis: {
      itemStyle: { borderColor: "#333", borderWidth: 2 },
    },
    animationDuration: 1500,
    animationEasing: "cubicOut",
  }],
  graphic: [{
    type: "text", right: 20, bottom: 10,
    style: { text: "RankMint", fontSize: 12, fill: "#ccc", fontStyle: "italic" },
  }],
});
window.addEventListener("resize", () => chart.resize());
</script>
</body>
</html>
