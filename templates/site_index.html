<!--
  Site Index Template
  - Generates output/index.html — card grid of all rankings.
  - SKILL.md Step 5 regenerates this after every pipeline run.
  - Self-contained HTML with client-side search/filter.
-->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RankMint — Data-Driven Rankings</title>
<meta property="og:title" content="RankMint — Data-Driven Rankings">
<meta property="og:description" content="Explore surprising, data-driven ranking indices on topics you never knew you cared about.">
<meta property="og:type" content="website">
<meta property="og:site_name" content="RankMint">
<meta name="twitter:card" content="summary">
<meta name="twitter:title" content="RankMint — Data-Driven Rankings">
<link rel="alternate" type="application/rss+xml" title="RankMint RSS Feed" href="feed.xml">
<!-- __ANALYTICS_SNIPPET__ -->
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #fafafa; color: #1a1a2e; }
  .header { text-align: center; padding: 48px 20px 32px; background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%); color: #fff; }
  .header h1 { font-size: 2rem; margin-bottom: 8px; }
  .header p { font-size: 1rem; color: #aaa; }
  .search-bar { max-width: 500px; margin: -20px auto 24px; position: relative; z-index: 1; }
  .search-bar input { width: 100%; padding: 14px 20px; border: none; border-radius: 12px; font-size: 1rem;
    box-shadow: 0 4px 16px rgba(0,0,0,0.12); outline: none; }
  .grid { max-width: 1100px; margin: 24px auto; padding: 0 20px;
    display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 20px; }
  .card { background: #fff; border-radius: 12px; padding: 24px; box-shadow: 0 2px 12px rgba(0,0,0,0.06);
    transition: transform 0.2s, box-shadow 0.2s; text-decoration: none; color: inherit; display: block; }
  .card:hover { transform: translateY(-4px); box-shadow: 0 8px 24px rgba(0,0,0,0.1); }
  .card h2 { font-size: 1.1rem; margin-bottom: 8px; }
  .card .hook { font-size: 0.85rem; color: #888; margin-bottom: 12px; line-height: 1.4; }
  .card .meta { display: flex; justify-content: space-between; font-size: 0.75rem; color: #aaa; }
  .card .winner { font-weight: 600; color: #4682B4; }
  .footer { text-align: center; padding: 32px; color: #aaa; font-size: 0.75rem; }
  .no-results { text-align: center; padding: 40px; color: #aaa; display: none; }
</style>
</head>
<body>
<div class="header">
  <h1>RankMint</h1>
  <p>Data-driven rankings on topics you never knew you cared about</p>
</div>
<div class="search-bar">
  <input type="text" id="search" placeholder="Search rankings...">
</div>
<div class="grid" id="grid">
  <!-- REPLACE: Skill step 5 generates cards here -->
  <!--
  <a class="card" href="coffee-obsession-index/index.html">
    <h2>Coffee Obsession Index</h2>
    <div class="hook">Which country is truly addicted to coffee? The answer isn't what you think.</div>
    <div class="meta">
      <span class="winner">#1: Finland</span>
      <span>2026-03-10</span>
    </div>
  </a>
  -->
</div>
<div class="no-results" id="no-results">No rankings found matching your search.</div>
<div class="footer">
  <a href="feed.xml" style="color:#4682B4;text-decoration:none;">RSS Feed</a> &middot; Generated by RankMint
</div>
<script>
const cards = document.querySelectorAll(".card");
const noResults = document.getElementById("no-results");
document.getElementById("search").addEventListener("input", e => {
  const q = e.target.value.toLowerCase();
  let visible = 0;
  cards.forEach(card => {
    const match = card.textContent.toLowerCase().includes(q);
    card.style.display = match ? "" : "none";
    if (match) visible++;
  });
  noResults.style.display = visible === 0 ? "block" : "none";
});
</script>
</body>
</html>
