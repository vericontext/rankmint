<!--
  Scrollytelling Landing Page Template
  - Vertical narrative flow — text and charts alternate as you scroll.
  - No hero banner; starts with a provocative opening paragraph.
  - Charts appear inline (not in a separate section).
  - Taxonomy is woven into the narrative, not a card grid.
  - "Find Yourself" becomes a mid-story interactive break.
  - Best for: topics with a strong narrative arc.
  - Storyteller MUST replace all DATA, CONFIG, and CONTENT sections with actual values.
-->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title><!-- REPLACE: Index Name | RankMint --></title>
<meta property="og:title" content="<!-- REPLACE: Index Name -->">
<meta property="og:description" content="<!-- REPLACE: One-line hook -->">
<meta property="og:image" content="card.png">
<meta property="og:url" content="<!-- REPLACE: canonical URL -->">

<meta property="og:site_name" content="RankMint">

<meta name="twitter:title" content="<!-- REPLACE: Index Name -->">
<meta name="twitter:description" content="<!-- REPLACE: One-line hook -->">

<script src="https://cdn.jsdelivr.net/npm/echarts@5/dist/echarts.min.js"></script>
<style>
  :root {
    --bg: #fafafa; --text: #1a1a2e; --muted: #888; --accent: #4682B4;
    --card-bg: #fff; --border: #eee;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'Georgia', 'Times New Roman', serif; background: var(--bg); color: var(--text); line-height: 1.8; }

  /* Scrollytelling narrative */
  .story { max-width: 720px; margin: 0 auto; padding: 0 24px; }
  .story-block { padding: 48px 0; opacity: 0; transform: translateY(30px); transition: opacity 0.8s ease, transform 0.8s ease; }
  .story-block.visible { opacity: 1; transform: translateY(0); }

  /* Opening — no hero, just text */
  .opening { padding: 80px 0 40px; border-bottom: 1px solid var(--border); }
  .opening h1 { font-size: 2rem; font-weight: 700; line-height: 1.3; margin-bottom: 16px; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
  .opening .byline { font-size: 0.85rem; color: var(--muted); margin-bottom: 24px; font-family: -apple-system, sans-serif; }
  .opening .lede { font-size: 1.15rem; line-height: 1.8; }

  /* Narrative paragraphs */
  .narrative { font-size: 1.05rem; line-height: 1.9; }
  .narrative p { margin-bottom: 1.5em; }
  .narrative strong { color: var(--accent); }
  .narrative blockquote { border-left: 3px solid var(--accent); padding-left: 20px; margin: 1.5em 0; font-style: italic; color: #555; }

  /* Inline chart */
  .inline-chart { width: 100%; height: 450px; background: var(--card-bg); border-radius: 12px;
    box-shadow: 0 2px 12px rgba(0,0,0,0.06); margin: 24px 0; }
  .chart-caption { font-size: 0.8rem; color: var(--muted); text-align: center; margin-top: 8px;
    font-family: -apple-system, sans-serif; }

  /* Inline taxonomy — woven into story */
  .story-taxonomy { background: var(--card-bg); border-radius: 12px; padding: 28px;
    box-shadow: 0 2px 12px rgba(0,0,0,0.06); margin: 24px 0; }
  .story-taxonomy h3 { font-size: 1.1rem; margin-bottom: 8px; color: var(--accent);
    font-family: -apple-system, sans-serif; }
  .story-taxonomy p { font-size: 0.9rem; color: var(--muted); margin-bottom: 12px; }
  .story-taxonomy .items { display: flex; flex-wrap: wrap; gap: 8px; }
  .story-taxonomy .item-tag { background: #f0f4ff; border-radius: 20px; padding: 6px 14px;
    font-size: 0.8rem; font-family: -apple-system, sans-serif; color: var(--text); }
  .story-taxonomy .item-tag .score { color: var(--muted); margin-left: 4px; }

  /* Mid-story interactive break (Find Yourself) */
  .story-interact { background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%); color: #fff;
    border-radius: 12px; padding: 36px 28px; text-align: center; margin: 24px 0; }
  .story-interact h2 { font-size: 1.3rem; margin-bottom: 16px; font-family: -apple-system, sans-serif; }
  .story-interact select { padding: 10px 20px; font-size: 1rem; border: 2px solid #FFD700; border-radius: 8px;
    background: rgba(255,255,255,0.1); color: #fff; min-width: 250px; }
  .story-interact select option { color: #1a1a2e; background: #fff; }
  .story-interact .result { display: none; margin: 20px auto 0; }
  .story-interact .result .rank { font-size: 2.5rem; font-weight: 900; color: #FFD700; }
  .story-interact .result .name { font-size: 1rem; margin: 4px auto; }
  .story-interact .result .score-text { font-size: 0.85rem; color: #aaa; }

  /* Callout box */
  .callout { background: linear-gradient(135deg, #FFD700 0%, #FF6B6B 100%); color: #1a1a2e;
    padding: 24px 28px; border-radius: 12px; margin: 24px 0; font-family: -apple-system, sans-serif; }
  .callout h3 { font-size: 1.1rem; margin-bottom: 8px; }
  .callout p { font-size: 0.9rem; }

  /* Full Table */
  .full-table { margin: 40px auto; max-width: 720px; }
  .full-table h2 { font-size: 1.3rem; margin-bottom: 12px; font-family: -apple-system, sans-serif; }
  .table-search { width: 100%; padding: 10px 16px; border: 1px solid var(--border); border-radius: 8px;
    font-size: 0.9rem; margin-bottom: 12px; font-family: -apple-system, sans-serif; }
  .full-table table { width: 100%; border-collapse: collapse; font-size: 0.85rem; background: var(--card-bg);
    border-radius: 8px; overflow: hidden; box-shadow: 0 2px 12px rgba(0,0,0,0.06);
    font-family: -apple-system, sans-serif; }
  .full-table th { background: #1a1a2e; color: #fff; padding: 10px 12px; text-align: left; cursor: pointer; user-select: none; }
  .full-table th:hover { background: #2d2d5e; }
  .full-table td { padding: 8px 12px; border-bottom: 1px solid var(--border); }
  .full-table tr:hover td { background: #f0f4ff; }

  /* Methodology */
  .methodology { max-width: 720px; margin: 40px auto; padding: 24px; background: var(--card-bg);
    border-radius: 12px; font-size: 0.85rem; color: var(--muted); font-family: -apple-system, sans-serif; }
  .methodology h2 { font-size: 1.1rem; color: var(--text); margin-bottom: 12px; }

  /* Share Bar */
  .share-bar { display: flex; justify-content: center; gap: 12px; padding: 30px 0; flex-wrap: wrap; }
  .share-btn { display: inline-flex; align-items: center; gap: 6px; padding: 10px 20px; border-radius: 8px;
    text-decoration: none; font-size: 0.85rem; font-weight: 600; color: #fff; transition: transform 0.2s;
    font-family: -apple-system, sans-serif; }
  .share-btn:hover { transform: translateY(-2px); }
  .share-twitter { background: #000; }
  .share-linkedin { background: #0A66C2; }
  .share-copy { background: #333; cursor: pointer; border: none; color: #fff; font-size: 0.85rem; font-weight: 600; }

  .footer { text-align: center; padding: 20px; color: var(--muted); font-size: 0.75rem; font-style: italic;
    font-family: -apple-system, sans-serif; }

  @media (max-width: 600px) {
    .opening h1 { font-size: 1.5rem; }
    .inline-chart { height: 350px; }
    .story { padding: 0 16px; }
  }
</style>
</head>
<body>

<!-- Top Navigation -->
<nav style="background:#1a1a2e;padding:10px 20px;display:flex;justify-content:space-between;align-items:center;">
  <a href="../" style="color:#FFD700;text-decoration:none;font-weight:600;font-size:0.9rem;font-family:-apple-system,sans-serif;">← RankMint Home</a>
  <span style="color:#666;font-size:0.75rem;font-family:-apple-system,sans-serif;">rankmint.io</span>
</nav>

<div class="story">

  <!-- Opening — no hero banner, just provocative text -->
  <div class="opening story-block">
    <h1 id="story-title"><!-- REPLACE: Provocative headline --></h1>
    <div class="byline"><!-- REPLACE: RankMint · Date · N items ranked --></div>
    <div class="lede" id="story-lede">
      <!-- REPLACE: 2-3 provocative opening paragraphs that pull the reader in -->
    </div>
  </div>

  <!-- Story Block 1: Setup + first chart -->
  <div class="story-block" id="block-1">
    <div class="narrative" id="narrative-1">
      <!-- REPLACE: Narrative paragraphs that set up the first visualization -->
    </div>
    <div class="inline-chart" id="chart-1"></div>
    <div class="chart-caption" id="caption-1"><!-- REPLACE: Chart caption --></div>
  </div>

  <!-- Callout: Surprise finding -->
  <div class="story-block">
    <div class="callout" id="callout-1">
      <h3><!-- REPLACE: Surprise headline --></h3>
      <p><!-- REPLACE: Counter-intuitive finding --></p>
    </div>
  </div>

  <!-- Story Block 2: Deeper analysis + taxonomy woven in -->
  <div class="story-block" id="block-2">
    <div class="narrative" id="narrative-2">
      <!-- REPLACE: Narrative that introduces groupings -->
    </div>
    <!-- Taxonomy blocks woven into narrative -->
    <!-- REPLACE: Add .story-taxonomy blocks here -->
    <!--
    <div class="story-taxonomy">
      <h3>Group Name</h3>
      <p>What unites them.</p>
      <div class="items">
        <span class="item-tag">Item A <span class="score">94.2</span></span>
        <span class="item-tag">Item B <span class="score">87.1</span></span>
      </div>
    </div>
    -->
  </div>

  <!-- Mid-story interactive break -->
  <div class="story-block">
    <div class="story-interact" id="find-section">
      <h2>Find Yourself</h2>
      <select id="find-select">
        <option value="">-- Select an item --</option>
      </select>
      <div class="result" id="result-card">
        <div class="rank" id="result-rank"></div>
        <div class="name" id="result-name"></div>
        <div class="score-text" id="result-score"></div>
      </div>
    </div>
  </div>

  <!-- Story Block 3: Second chart + conclusion -->
  <div class="story-block" id="block-3">
    <div class="narrative" id="narrative-3">
      <!-- REPLACE: Narrative wrapping up, leading to second chart -->
    </div>
    <div class="inline-chart" id="chart-2"></div>
    <div class="chart-caption" id="caption-2"><!-- REPLACE: Chart caption --></div>
  </div>

  <!-- Closing narrative -->
  <div class="story-block" id="block-closing">
    <div class="narrative" id="narrative-closing">
      <!-- REPLACE: Final takeaway paragraphs -->
    </div>
  </div>

</div>

<!-- Full Table (outside .story for full width) -->
<section class="full-table" style="padding:0 24px;">
  <h2>Full Rankings</h2>
  <input type="text" class="table-search" id="table-search" placeholder="Search...">
  <table id="ranking-table">
    <thead id="table-head"></thead>
    <tbody id="table-body"></tbody>
  </table>
</section>

<!-- Methodology -->
<section class="methodology" style="margin-left:auto;margin-right:auto;" id="methodology">
  <!-- REPLACE: Storyteller fills methodology details -->
</section>

<!-- Share Bar -->
<div class="share-bar">
  <a class="share-btn share-twitter" id="share-twitter" href="#" target="_blank">Share on X</a>
  <a class="share-btn share-linkedin" id="share-linkedin" href="#" target="_blank">LinkedIn</a>
  <button class="share-btn share-copy" id="share-copy">Copy Link</button>
</div>

<div class="footer">Generated by RankMint</div>

<script>
// ===== DATA — storyteller replaces this =====
const DATA = [
  // { rank: 1, name: "Item A", score: 94.2, metric1: 80, metric2: 95 },
];

// ===== CONFIG — storyteller customizes these =====
const CONFIG = {
  title: "Index Name",
  hook: "One-line hook",
  nameField: "name",
  scoreField: "score",
  topN: 15,
  tableColumns: ["rank", "name", "score"],
  tableHeaders: ["Rank", "Name", "Score"],
  palette: "gold-steel",
  shareUrl: "",
  shareText: "",
};

const PALETTES = {
  "gold-steel": ["#FFD700", "#4682B4"],
  "sunset":     ["#FF6B6B", "#6B2FA0"],
  "forest":     ["#A8E06C", "#1B5E20"],
  "ocean":      ["#00E5FF", "#0D47A1"],
  "berry":      ["#E91E63", "#4A148C"],
  "ember":      ["#FF9800", "#BF360C"],
};

function interpolateColor(c1, c2, t) {
  const hex = s => parseInt(s, 16);
  const r = Math.round(hex(c1.slice(1,3)) + (hex(c2.slice(1,3)) - hex(c1.slice(1,3))) * t);
  const g = Math.round(hex(c1.slice(3,5)) + (hex(c2.slice(3,5)) - hex(c1.slice(3,5))) * t);
  const b = Math.round(hex(c1.slice(5,7)) + (hex(c2.slice(5,7)) - hex(c1.slice(5,7))) * t);
  return `rgb(${r},${g},${b})`;
}

// ===== Scroll reveal =====
const observer = new IntersectionObserver(entries => {
  entries.forEach(e => { if (e.isIntersecting) e.target.classList.add("visible"); });
}, { threshold: 0.15 });
document.querySelectorAll(".story-block").forEach(el => observer.observe(el));

// ===== Find Yourself =====
const findSelect = document.getElementById("find-select");
DATA.forEach(d => {
  const opt = document.createElement("option");
  opt.value = d[CONFIG.nameField]; opt.textContent = d[CONFIG.nameField];
  findSelect.appendChild(opt);
});
findSelect.addEventListener("change", () => {
  const selected = DATA.find(d => d[CONFIG.nameField] === findSelect.value);
  if (!selected) { document.getElementById("result-card").style.display = "none"; return; }
  document.getElementById("result-card").style.display = "block";
  document.getElementById("result-rank").textContent = `#${selected.rank || DATA.indexOf(selected) + 1}`;
  document.getElementById("result-name").textContent = selected[CONFIG.nameField];
  document.getElementById("result-score").textContent = `Score: ${selected[CONFIG.scoreField].toFixed(1)}`;
});

// ===== Full Table =====
const thead = document.getElementById("table-head");
const tbody = document.getElementById("table-body");
const headerRow = document.createElement("tr");
CONFIG.tableHeaders.forEach((h, i) => {
  const th = document.createElement("th");
  th.textContent = h;
  th.addEventListener("click", () => sortTable(i));
  headerRow.appendChild(th);
});
thead.appendChild(headerRow);

let tableData = [...DATA].sort((a, b) => (a.rank || 0) - (b.rank || 0));
function renderTable(data) {
  tbody.innerHTML = "";
  data.forEach(d => {
    const tr = document.createElement("tr");
    CONFIG.tableColumns.forEach(col => {
      const td = document.createElement("td");
      const v = d[col];
      td.textContent = typeof v === "number" ? (v % 1 === 0 ? v : v.toFixed(1)) : v;
      tr.appendChild(td);
    });
    tbody.appendChild(tr);
  });
}
renderTable(tableData);

let sortDir = {};
function sortTable(colIdx) {
  const col = CONFIG.tableColumns[colIdx];
  sortDir[col] = !(sortDir[col] || false);
  tableData.sort((a, b) => {
    const va = a[col], vb = b[col];
    const cmp = typeof va === "number" ? va - vb : String(va).localeCompare(String(vb));
    return sortDir[col] ? cmp : -cmp;
  });
  renderTable(tableData);
}

document.getElementById("table-search").addEventListener("input", e => {
  const q = e.target.value.toLowerCase();
  renderTable(tableData.filter(d => Object.values(d).some(v => String(v).toLowerCase().includes(q))));
});

// ===== Share =====
const url = CONFIG.shareUrl || window.location.href;
const text = CONFIG.shareText || CONFIG.hook;
document.getElementById("share-twitter").href = `https://x.com/intent/post?text=${encodeURIComponent(text)}&url=${encodeURIComponent(url)}`;
document.getElementById("share-linkedin").href = `https://www.linkedin.com/sharing/share-offsite/?url=${encodeURIComponent(url)}`;
document.getElementById("share-copy").addEventListener("click", () => {
  navigator.clipboard.writeText(url).then(() => {
    document.getElementById("share-copy").textContent = "Copied!";
    setTimeout(() => document.getElementById("share-copy").textContent = "Copy Link", 2000);
  });
});

// ===== Charts are initialized by storyteller inline =====
// The storyteller will add chart initialization code for #chart-1 and #chart-2
// using echarts.init() with appropriate options for the topic.
</script>
</body>
</html>
