  .tier-item .item-series { font-size: 0.68rem; color: #666; margin-top: 1px; }
  .tooltip-box {
    display: none; position: absolute; bottom: calc(100% + 8px); left: 50%; transform: translateX(-50%);

  .watermark { text-align: right; padding: 10px 28px 20px; color: #2a4a20; font-size: 0.75rem; font-style: italic; }

const TIERS = [
  { label: "S", sublabel: "The Model\nEducators",    range: "8.5+",      min: 8.5,  color: "#3da642" },
  { label: "A", sublabel: "Actually Good\nTeachers", range: "7.0–8.49",  min: 7.0,  color: "#78b840" },
  { label: "B", sublabel: "Mixed\nResults",          range: "5.5–6.99",  min: 5.5,  color: "#b8cc50" },
  { label: "C", sublabel: "The\nOverrated",          range: "3.5–5.49",  min: 3.5,  color: "#e8a840" },
  { label: "D", sublabel: "Coattail\nLegends",       range: "0–3.49",    min: 0,    color: "#d05030" },
];

const sorted = [...DATA].sort((a, b) => b.score - a.score);
const container = document.getElementById("tiers");

TIERS.forEach(tier => {
  const higherMins = TIERS.filter(t => t.min > tier.min).map(t => t.min);
  const nextMin = higherMins.length ? Math.min(...higherMins) : Infinity;
  const tierItems = sorted.filter(d => d.score >= tier.min && d.score < nextMin);

  const row = document.createElement("div");
  row.className = "tier-row";

  const labelDiv = document.createElement("div");
  labelDiv.className = "tier-label";
  labelDiv.style.background = tier.color;
  labelDiv.innerHTML = `<div class="tier-label-inner">
    <span>${tier.label}</span>
    <span class="score-range">${tier.range}</span>
  </div>`;
  row.appendChild(labelDiv);

  const itemsDiv = document.createElement("div");
  itemsDiv.className = "tier-items";

  tierItems.forEach(d => {
    const el = document.createElement("div");
    el.className = "tier-item";
    el.innerHTML = `
      <div class="item-name">${d.name}</div>
      <div class="item-series">${d.series}</div>
      <div class="item-score">${d.score.toFixed(2)} pts</div>
      <div class="tooltip-box">
        <b>${d.name}</b> — #${d.rank}<br/>
        <div class="tip-row">Curriculum: ${d.curriculum}/10</div>
        <div class="tip-row">Survival: ${d.survival}/10</div>
        <div class="tip-row">Emotional IQ: ${d.emotional}/10</div>
        <div class="tip-row">Availability: ${d.availability}/10</div>
        <div class="tip-row">Outcome Delta: ${d.delta}/10</div>
        <div class="tip-row">Equitable Attn: ${d.equity}/10</div>
      </div>
    `;
    itemsDiv.appendChild(el);
  });

  row.appendChild(itemsDiv);
  container.appendChild(row);
});

// Staggered entrance animation
document.querySelectorAll(".tier-item").forEach((el, i) => {
  el.style.opacity = "0";
  el.style.transform = "translateY(12px) scale(0.96)";
  setTimeout(() => {
    el.style.transition = "opacity 0.35s, transform 0.35s";
    el.style.opacity = "1";
    el.style.transform = "translateY(0) scale(1)";
  }, 80 + i * 40);
});
