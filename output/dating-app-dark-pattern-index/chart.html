const CONFIG = {
  scoreField: "score",
  nameField: "name",
  topN: 23,
  palette: "berry",
};

const PALETTES = {
  "berry": ["#E91E63", "#4A148C"],
};

function interpolateColor(c1, c2, t) {
  const hex = s => parseInt(s, 16);
  const r = Math.round(hex(c1.slice(1,3)) + (hex(c2.slice(1,3)) - hex(c1.slice(1,3))) * t);
  const g = Math.round(hex(c1.slice(3,5)) + (hex(c2.slice(3,5)) - hex(c1.slice(3,5))) * t);
  const b = Math.round(hex(c1.slice(5,7)) + (hex(c2.slice(5,7)) - hex(c1.slice(5,7))) * t);
  return `rgb(${r},${g},${b})`;
}

const sorted = [...DATA].sort((a, b) => b[CONFIG.scoreField] - a[CONFIG.scoreField]).slice(0, CONFIG.topN);
const names = sorted.map(d => d[CONFIG.nameField]).reverse();
const scores = sorted.map(d => d[CONFIG.scoreField]).reverse();

const [c1, c2] = PALETTES[CONFIG.palette];
const colors = scores.map((_, i) => interpolateColor(c2, c1, i / Math.max(scores.length - 1, 1)));

const TIER_COLORS = { S: "#FF4C4C", A: "#FF9800", B: "#42A5F5", C: "#AB47BC", D: "#78909C" };
const sortedReversed = [...sorted].reverse();

chart.setOption({
  tooltip: {
    trigger: "axis",
    axisPointer: { type: "shadow" },
    formatter: params => {
      const d = sortedReversed[params[0].dataIndex];
      return `<b>${d.name}</b> (${d.owner})<br/>
        Dark Pattern Score: <b>${d.score.toFixed(1)}</b> — Tier ${d.tier}<br/>
        Swipe Addiction: ${d.swipe} &nbsp; Paywall: ${d.paywall}<br/>

    }

  grid: { left: "24%", right: "12%", top: 20, bottom: 30 },
  xAxis: {
    type: "value",

    max: 100,
    axisLabel: { fontSize: 11 }
  },
  yAxis: {
    type: "category",
    data: names,

  series: [{

    data: scores.map((v, i) => ({

      itemStyle: { color: colors[i], borderRadius: [0, 4, 4, 0] }
    })),
    barWidth: "60%",
    label: {
      show: true,
      position: "right",
      formatter: p => p.value.toFixed(1),
      fontSize: 11,
      color: "#333"

    animationDuration: 1800,

  graphic: [{
