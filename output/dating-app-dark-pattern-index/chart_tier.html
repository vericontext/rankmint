<script>

  { rank: 10, name: "OkCupid",            score: 62.5, swipe: 6,  paywall: 6,  notifications: 7, visibility: 6,  subtrap: 6, data: 8, fomo: 5,  scarcity: 6,  owner: "Match Group" },
  { rank: 11, name: "The League",         score: 62.5, swipe: 4,  paywall: 9,  notifications: 5, visibility: 7,  subtrap: 7, data: 5, fomo: 6,  scarcity: 7,  owner: "Match Group" },
  { rank: 12, name: "Pairs",              score: 61.3, swipe: 6,  paywall: 7,  notifications: 6, visibility: 7,  subtrap: 6, data: 7, fomo: 5,  scarcity: 5,  owner: "Match Group" },
  { rank: 13, name: "Grindr",             score: 58.8, swipe: 7,  paywall: 5,  notifications: 6, visibility: 5,  subtrap: 5, data: 10,fomo: 4,  scarcity: 5,  owner: "Grindr LLC" },

];

const CONFIG = {
  nameField: "name",
  scoreField: "score",
  tiers: [
    { label: "S", min: 85, color: "#C62828", desc: "Digital Predators — These apps would monetize your loneliness if they could. Oh wait, they already do." },
    { label: "A", min: 70, color: "#E91E63", desc: "Manipulation Machines — They've read the behavioral psychology papers and implemented ALL of them." },
    { label: "B", min: 55, color: "#7B1FA2", desc: "The Paywall Industrial Complex — Free to download, expensive to actually use." },
    { label: "C", min: 40, color: "#4A148C", desc: "Diet Manipulation — They try, but they're not very good at it." },
    { label: "D", min: 0,  color: "#37474F", desc: "The Honest Ones — They exist. There are three of them." },
  ],
  tooltipFields: ["swipe", "paywall", "notifications", "visibility", "subtrap", "data", "fomo", "scarcity"],
};

const sorted = [...DATA].sort((a, b) => b[CONFIG.scoreField] - a[CONFIG.scoreField]);
const container = document.getElementById("tiers");

// Sort tiers by min DESCENDING so .find() returns the highest matching tier
const sortedTiers = [...CONFIG.tiers].sort((a, b) => b.min - a.min);

CONFIG.tiers.forEach(tier => {
  const tierItems = sorted.filter(d => {
    const s = d[CONFIG.scoreField];
    const assigned = sortedTiers.find(t => s >= t.min);
    return assigned && assigned.label === tier.label;
  });

  const descEl = document.createElement("div");
  descEl.className = "tier-desc";
  descEl.textContent = `${tier.label}-TIER: ${tier.desc}`;
  container.appendChild(descEl);

  const row = document.createElement("div");
  row.className = "tier-row";
  row.innerHTML = `<div class="tier-label" style="background:${tier.color}">${tier.label}</div>`;
  const itemsDiv = document.createElement("div");
  itemsDiv.className = "tier-items";

  tierItems.forEach(d => {
    const el = document.createElement("div");
    el.className = "tier-item";
    let tooltipHtml = `<b>${d[CONFIG.nameField]}</b><br/>Score: ${d[CONFIG.scoreField].toFixed(1)}<br/>${d.owner}<br/>`;
    tooltipHtml += `Swipe: ${d.swipe} | Paywall: ${d.paywall}<br/>Notif: ${d.notifications} | Visibility: ${d.visibility}<br/>SubTrap: ${d.subtrap} | Data: ${d.data}<br/>FOMO: ${d.fomo} | Scarcity: ${d.scarcity}`;
    el.innerHTML = `
      ${d[CONFIG.nameField]}
      <div class="score">${d[CONFIG.scoreField].toFixed(1)}</div>
      <div class="tooltip">${tooltipHtml}</div>
    `;
    itemsDiv.appendChild(el);
  });

  row.appendChild(itemsDiv);
  container.appendChild(row);
});

// Entrance animation
document.querySelectorAll(".tier-item").forEach((el, i) => {
  el.style.opacity = "0";
  el.style.transform = "translateY(10px)";
  setTimeout(() => {
    el.style.transition = "opacity 0.4s, transform 0.4s";
    el.style.opacity = "1";
    el.style.transform = "translateY(0)";
  }, 50 + i * 30);
});
</script>
