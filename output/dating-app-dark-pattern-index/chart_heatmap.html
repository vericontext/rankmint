<div class="header">
  <h1>Dating App Dark Pattern Heatmap</h1>
  <p>23 apps × 8 manipulation dimensions. Red = maximum predatory (10/10). Green = minimal. Sorted by overall score. RankMint · March 2026</p>
</div>
<div id="chart"></div>
<script>
const DATA = [
  { name: "Tinder",             score: 92.5, swipe: 10, paywall: 10, notifications: 9, visibility: 10, subtrap: 8, data: 9, fomo: 8,  scarcity: 10 },
  { name: "Hinge",              score: 77.5, swipe: 8,  paywall: 9,  notifications: 6, visibility: 8,  subtrap: 7, data: 8, fomo: 7,  scarcity: 9  },
  { name: "Match.com",          score: 76.2, swipe: 5,  paywall: 9,  notifications: 10,visibility: 7,  subtrap: 10,data: 7, fomo: 6,  scarcity: 7  },
  { name: "Bumble",             score: 75.0, swipe: 7,  paywall: 8,  notifications: 7, visibility: 7,  subtrap: 7, data: 6, fomo: 10, scarcity: 8  },
  { name: "Badoo",              score: 73.8, swipe: 9,  paywall: 7,  notifications: 8, visibility: 8,  subtrap: 6, data: 8, fomo: 6,  scarcity: 7  },
  { name: "Zoosk",              score: 68.8, swipe: 6,  paywall: 8,  notifications: 8, visibility: 7,  subtrap: 7, data: 6, fomo: 5,  scarcity: 8  },
  { name: "Happn",              score: 68.8, swipe: 7,  paywall: 8,  notifications: 9, visibility: 8,  subtrap: 5, data: 6, fomo: 5,  scarcity: 7  },
  { name: "Tantan",             score: 68.8, swipe: 8,  paywall: 7,  notifications: 7, visibility: 7,  subtrap: 6, data: 9, fomo: 5,  scarcity: 6  },
  { name: "Plenty of Fish",     score: 65.0, swipe: 6,  paywall: 7,  notifications: 8, visibility: 7,  subtrap: 8, data: 6, fomo: 4,  scarcity: 6  },
  { name: "OkCupid",            score: 62.5, swipe: 6,  paywall: 6,  notifications: 7, visibility: 6,  subtrap: 6, data: 8, fomo: 5,  scarcity: 6  },
  { name: "The League",         score: 62.5, swipe: 4,  paywall: 9,  notifications: 5, visibility: 7,  subtrap: 7, data: 5, fomo: 6,  scarcity: 7  },
  { name: "Pairs",              score: 61.3, swipe: 6,  paywall: 7,  notifications: 6, visibility: 7,  subtrap: 6, data: 7, fomo: 5,  scarcity: 5  },
  { name: "Grindr",             score: 58.8, swipe: 7,  paywall: 5,  notifications: 6, visibility: 5,  subtrap: 5, data: 10,fomo: 4,  scarcity: 5  },
  { name: "Coffee Meets Bagel", score: 56.2, swipe: 3,  paywall: 8,  notifications: 5, visibility: 5,  subtrap: 6, data: 5, fomo: 6,  scarcity: 7  },
  { name: "eHarmony",           score: 56.2, swipe: 3,  paywall: 8,  notifications: 6, visibility: 5,  subtrap: 10,data: 5, fomo: 3,  scarcity: 5  },
  { name: "Lumen",              score: 53.8, swipe: 4,  paywall: 7,  notifications: 6, visibility: 6,  subtrap: 6, data: 5, fomo: 4,  scarcity: 5  },
  { name: "Her",                score: 46.2, swipe: 5,  paywall: 5,  notifications: 5, visibility: 4,  subtrap: 5, data: 5, fomo: 4,  scarcity: 4  },
  { name: "Snack",              score: 42.5, swipe: 5,  paywall: 4,  notifications: 4, visibility: 4,  subtrap: 4, data: 5, fomo: 4,  scarcity: 4  },
  { name: "Feeld",              score: 41.2, swipe: 4,  paywall: 5,  notifications: 3, visibility: 4,  subtrap: 4, data: 7, fomo: 3,  scarcity: 3  },
  { name: "Ship",               score: 41.2, swipe: 4,  paywall: 4,  notifications: 5, visibility: 4,  subtrap: 4, data: 4, fomo: 4,  scarcity: 4  },
  { name: "Thursday",           score: 37.5, swipe: 2,  paywall: 4,  notifications: 3, visibility: 2,  subtrap: 4, data: 3, fomo: 8,  scarcity: 4  },
  { name: "Archer",             score: 32.5, swipe: 3,  paywall: 4,  notifications: 3, visibility: 3,  subtrap: 3, data: 4, fomo: 3,  scarcity: 3  },
  { name: "Raya",               score: 31.2, swipe: 3,  paywall: 5,  notifications: 2, visibility: 3,  subtrap: 3, data: 3, fomo: 3,  scarcity: 3  },
];

const CONFIG = {
  nameField: "name",
  scoreField: "score",
  metrics: ["swipe", "paywall", "notifications", "visibility", "subtrap", "data", "fomo", "scarcity"],
  metricLabels: ["Swipe Addiction", "Paywall Manip.", "Notif. Spam", "Visibility Throttle", "Sub Trap", "Data Harvest", "FOMO Mechanics", "Fake Scarcity"],
  // Red-hot for high manipulation (bad for user), cooling to green for low
  colorRange: ["#1B5E20", "#388E3C", "#81C784", "#FFF9C4", "#FFB74D", "#EF5350", "#B71C1C"],
};

const sorted = [...DATA].sort((a, b) => b[CONFIG.scoreField] - a[CONFIG.scoreField]);
// For heatmap, display top apps at top (index 0) — so we reverse for y-axis
const displayOrder = [...sorted].reverse();
const names = displayOrder.map(d => d[CONFIG.nameField]);
const metrics = CONFIG.metrics;
const labels = CONFIG.metricLabels;

// Use raw 1-10 values directly, map to 0-100 for visual map
const heatData = [];
displayOrder.forEach((d, yi) => {
  metrics.forEach((m, xi) => {
    const raw = d[m];
    // 1-10 scale → 0-100 for visualMap
    const norm = ((raw - 1) / 9) * 100;
    heatData.push([xi, yi, norm, raw]);
  });
});

const chart = echarts.init(document.getElementById("chart"));
chart.setOption({
  tooltip: {
    position: "top",
    formatter: p => {
      const d = displayOrder[p.value[1]];
      const metric = labels[p.value[0]];
      const raw = p.value[3];
      return `<b>${d[CONFIG.nameField]}</b><br/>${metric}: <b>${raw}/10</b><br/>Overall Score: ${d[CONFIG.scoreField].toFixed(1)}`;
    },
  },
  grid: { left: "22%", right: "8%", top: 80, bottom: 30 },
  xAxis: {
    type: "category",
    data: labels,
    position: "top",
    axisLabel: { fontSize: 10, rotate: 25, color: "#333" },
    splitArea: { show: true },
  },
  yAxis: {
    type: "category",
    data: names,
    inverse: false,
    axisLabel: { fontSize: 10, color: "#333" },
    splitArea: { show: true },
  },
  visualMap: {
    min: 0,
    max: 100,
    calculable: true,
    orient: "horizontal",
    left: "center",
    top: 10,
    inRange: { color: CONFIG.colorRange },
    text: ["Max Manipulation (10)", "Min Manipulation (1)"],
    textStyle: { fontSize: 10, color: "#333" },
  },
  dataZoom: [
    { type: "inside", yAxisIndex: 0, filterMode: "none" },
  ],
  series: [{
    type: "heatmap",
    data: heatData,
    label: {
      show: true,
      formatter: p => p.value[3],
      fontSize: 10,
      color: "#333",
      fontWeight: "bold",
    },
    emphasis: {
      itemStyle: { borderColor: "#1a1a2e", borderWidth: 2 },
    },
    animationDuration: 1800,
    animationEasing: "cubicOut",
  }],
  graphic: [{
    type: "text", right: 20, bottom: 10,
    style: { text: "RankMint", fontSize: 12, fill: "#ccc", fontStyle: "italic" },
  }],
});
window.addEventListener("resize", () => chart.resize());
</script>
