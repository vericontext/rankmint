<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { width: 1200px; height: 630px; overflow: hidden; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
  .card {
    width: 1200px; height: 630px;
    background: linear-gradient(135deg, #1a0025 0%, #2d0a4e 50%, #4A148C 100%);
    color: #fff; display: flex; flex-direction: column; justify-content: center; padding: 60px 80px;
    position: relative;
  }
  .accent-line {
    position: absolute; top: 0; left: 0; width: 100%; height: 6px;
    background: linear-gradient(90deg, #E91E63, #FF6090, #FF4081, #E91E63);
  }
  .eyebrow { font-size: 14px; font-weight: 600; letter-spacing: 3px; text-transform: uppercase;
    color: #E91E63; margin-bottom: 16px; }
  .title { font-size: 52px; font-weight: 800; margin-bottom: 20px; line-height: 1.15; max-width: 820px; }
  .hook { font-size: 20px; color: rgba(255,255,255,0.75); margin-bottom: 44px; max-width: 680px; line-height: 1.5; }
  .top3 { display: flex; gap: 20px; }
  .top-item { background: rgba(255,255,255,0.08); border: 1px solid rgba(233,30,99,0.3); border-radius: 14px; padding: 20px 28px; min-width: 210px; }
  .top-item .medal { font-size: 30px; font-weight: 900; margin-bottom: 6px; }
  .top-item .medal.gold { color: #FF4081; }
  .top-item .medal.silver { color: #CE93D8; }
  .top-item .medal.bronze { color: #F48FB1; }
  .top-item .item-name { font-size: 18px; font-weight: 700; }
  .top-item .item-score { font-size: 13px; color: rgba(255,255,255,0.5); margin-top: 5px; }
  .watermark {
    position: absolute; bottom: 30px; right: 44px;
    font-size: 16px; color: rgba(255,255,255,0.25); font-weight: 700; letter-spacing: 3px;
  }
  .n-badge {
    position: absolute; top: 30px; right: 44px;
    background: rgba(233,30,99,0.2); border: 1px solid rgba(233,30,99,0.4);
    border-radius: 20px; padding: 6px 16px; font-size: 13px; color: rgba(255,255,255,0.7); font-weight: 600;
  }
</style>
</head>
<body>
<div class="card">
  <div class="accent-line"></div>
  <div class="n-badge">23 apps ranked</div>
  <div class="eyebrow">RankMint · Dark Pattern Index</div>
  <div class="title">Dating App Dark Pattern Index</div>
  <div class="hook">Your dating app doesn't want you to find love. It wants you to find a subscription.</div>
  <div class="top3">
    <div class="top-item">
      <div class="medal gold">#1</div>
      <div class="item-name">Tinder</div>
      <div class="item-score">92.5 — S Tier (Digital Predator)</div>
    </div>
    <div class="top-item">
      <div class="medal silver">#2</div>
      <div class="item-name">Hinge</div>
      <div class="item-score">77.5 — "Designed to be deleted"</div>
    </div>
    <div class="top-item">
      <div class="medal bronze">#3</div>
      <div class="item-name">Match.com</div>
      <div class="item-score">76.2 — $14M FTC settlement</div>
    </div>
  </div>
  <div class="watermark">RANKMINT</div>
</div>
</body>
</html>
