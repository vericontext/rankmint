<body>
<nav style="padding:10px 20px;display:flex;gap:16px;align-items:center;">

<div class="header">
  <h1>Top 15 Most Endangered Programming Languages</h1>
  <p>Extinction Risk Score (0 = thriving, 100 = extinct) · Sources: TIOBE March 2026, Stack Overflow Developer Survey 2024, GitHub Octoverse · RankMint</p>
</div>
<div id="chart"></div>
<script>
const DATA = [
  { rank: 1,  name: "ActionScript",  score: 100.0, tiobe_rank: 100, so_usage: 0.1,  job_demand: 2,  first_year: 1998, note: "Flash EOL Dec 2020. The language that ceased." },
  { rank: 2,  name: "ColdFusion",    score: 97.3,  tiobe_rank: 90,  so_usage: 0.1,  job_demand: 5,  first_year: 1995, note: "Adobe life-support. 0.3% of websites." },
  { rank: 3,  name: "Groovy",        score: 86.5,  tiobe_rank: 55,  so_usage: 3.3,  job_demand: 12, first_year: 2003, note: "Replaced by Kotlin on its own JVM." },
  { rank: 4,  name: "Haskell",       score: 84.8,  tiobe_rank: 42,  so_usage: 2.0,  job_demand: 8,  first_year: 1990, note: "73.9K Reddit community. Zero jobs." },
  { rank: 5,  name: "Erlang",        score: 84.2,  tiobe_rank: 34,  so_usage: 0.9,  job_demand: 8,  first_year: 1986, note: "Ericsson + WhatsApp. Nowhere else." },
  { rank: 6,  name: "Objective-C",   score: 81.3,  tiobe_rank: 31,  so_usage: 2.1,  job_demand: 12, first_year: 1983, note: "Swift replaced it. Lives in iOS legacy." },
  { rank: 7,  name: "Pascal/Delphi", score: 78.8,  tiobe_rank: 10,  so_usage: 1.8,  job_demand: 10, first_year: 1970, note: "TIOBE rank inflated by legacy doc searches." },
  { rank: 8,  name: "Lua",           score: 78.1,  tiobe_rank: 32,  so_usage: 6.2,  job_demand: 15, first_year: 1993, note: "Game scripting niche. No growth path." },
  { rank: 9,  name: "Scala",         score: 78.0,  tiobe_rank: 38,  so_usage: 2.6,  job_demand: 25, first_year: 2003, note: "Kotlin absorbed its JVM future." },
  { rank: 10, name: "COBOL",         score: 78.0,  tiobe_rank: 24,  so_usage: 0.7,  job_demand: 30, first_year: 1959, note: "1,400+ open jobs. Banks need it. Not as dead as it seems." },
  { rank: 11, name: "Fortran",       score: 77.3,  tiobe_rank: 13,  so_usage: 1.1,  job_demand: 20, first_year: 1957, note: "NASA + weather modeling. Scientific niche." },
  { rank: 12, name: "Perl",          score: 77.2,  tiobe_rank: 11,  so_usage: 2.5,  job_demand: 10, first_year: 1987, note: "TIOBE #11 is a mirage of legacy web pages." },
  { rank: 13, name: "MATLAB",        score: 76.3,  tiobe_rank: 17,  so_usage: 4.0,  job_demand: 20, first_year: 1984, note: "Proprietary pricing drives universities to Python." },
  { rank: 14, name: "Visual Basic",  score: 75.9,  tiobe_rank: 7,   so_usage: 4.2,  job_demand: 15, first_year: 1991, note: "VB6 abandoned 2008. VB.NET barely touched." },
  { rank: 15, name: "Assembly",      score: 75.0,  tiobe_rank: 17,  so_usage: 5.4,  job_demand: 20, first_year: 1949, note: "Hardware permanent. No growth path." },
];

const CONFIG = {
  scoreField: "score",
  nameField: "name",
  topN: 15,
  palette: "sunset",
};

const PALETTES = {
  "sunset": ["#FF6B6B", "#6B2FA0"],
};

function interpolateColor(c1, c2, t) {
  const hex = s => parseInt(s, 16);
  const r = Math.round(hex(c1.slice(1,3)) + (hex(c2.slice(1,3)) - hex(c1.slice(1,3))) * t);
  const g = Math.round(hex(c1.slice(3,5)) + (hex(c2.slice(3,5)) - hex(c1.slice(3,5))) * t);
  const b = Math.round(hex(c1.slice(5,7)) + (hex(c2.slice(5,7)) - hex(c1.slice(5,7))) * t);
  return `rgb(${r},${g},${b})`;
}

const sorted = [...DATA].sort((a, b) => b[CONFIG.scoreField] - a[CONFIG.scoreField]).slice(0, CONFIG.topN);
const names = sorted.map(d => d[CONFIG.nameField]).reverse();
const scores = sorted.map(d => d[CONFIG.scoreField]).reverse();

const [c1, c2] = PALETTES[CONFIG.palette];
const colors = scores.map((_, i) => interpolateColor(c2, c1, i / Math.max(scores.length - 1, 1)));

const chart = echarts.init(document.getElementById("chart"));
chart.setOption({
  backgroundColor: "#fafafa",
  tooltip: {
    trigger: "axis",
    axisPointer: { type: "shadow" },
    formatter: params => {
      const d = sorted[scores.length - 1 - params[0].dataIndex];
      return `<b>${d.name}</b><br/>Extinction Risk: ${d.score.toFixed(1)}/100<br/>TIOBE Rank: #${d.tiobe_rank}<br/>SO Usage: ${d.so_usage}%<br/>Job Demand: ${d.job_demand}/100<br/><em>${d.note}</em>`;
    }
  },
  grid: { left: "22%", right: "12%", top: 20, bottom: 30 },
  xAxis: {
    type: "value",
    name: "Extinction Risk Score",
    max: 105,
    axisLabel: { formatter: "{value}" },
  },
  yAxis: {
    type: "category",
    data: names,
    axisLabel: { fontSize: 12, fontWeight: 500 },
  },
  dataZoom: [{ type: "inside", yAxisIndex: 0, filterMode: "none" }],
  series: [{
    type: "bar",
    data: scores.map((v, i) => ({ value: v, itemStyle: { color: colors[i] } })),
    barWidth: "60%",
    label: {
      show: true,
      position: "right",
      formatter: params => params.value.toFixed(1),
      fontSize: 11,
      color: "#444",
    },
    animationDuration: 1500,
    animationEasing: "elasticOut",
  }],
  graphic: [{
    type: "text", right: 20, bottom: 10,
    style: { text: "RankMint", fontSize: 12, fill: "#ccc", fontStyle: "italic" },
  }],
});
window.addEventListener("resize", () => chart.resize());
</script>
