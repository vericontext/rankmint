];

const CONFIG = {
  nameField: "name",
  scoreField: "score",
  tiers: [
    { label: "S", sublabel: "HELLSCAPE", min: 70, color: "#C0392B" },
    { label: "A", sublabel: "STRESSFUL", min: 55, color: "#E67E22" },
    { label: "B", sublabel: "SURVIVABLE", min: 40, color: "#D4AC0D" },
    { label: "C", sublabel: "MANAGEABLE", min: 25, color: "#27AE60" },
    { label: "D", sublabel: "ZEN MASTER", min: 0,  color: "#2980B9" },
  ],
  tooltipFields: ["delay", "security", "congestion", "wayfinding", "wifi", "amenity", "immigration"],
  tooltipLabels: ["Delay", "Security", "Congestion", "Wayfinding", "Wi-Fi (inv)", "Amenity (inv)", "Immigration"],
};

// Sort TIERS descending by min for correct assignment
const sortedTiers = [...CONFIG.tiers].sort((a, b) => b.min - a.min);
const sorted = [...DATA].sort((a, b) => b[CONFIG.scoreField] - a[CONFIG.scoreField]);
const container = document.getElementById("tiers");

CONFIG.tiers.forEach(tier => {
  const tierItems = sorted.filter(d => {
    const s = d[CONFIG.scoreField];
    const assigned = sortedTiers.find(t => s >= t.min);
    return assigned && assigned.label === tier.label;
  });

  const row = document.createElement("div");
  row.className = "tier-row";
  row.innerHTML = `<div class="tier-label" style="background:${tier.color}">${tier.label}<div class="tier-sublabel">${tier.sublabel}</div></div>`;
  const itemsDiv = document.createElement("div");
  itemsDiv.className = "tier-items";

  tierItems.forEach(d => {
    const el = document.createElement("div");
    el.className = "tier-item";
    let tooltipHtml = `<b>${d.name} (${d.code})</b><br/>Score: ${d[CONFIG.scoreField].toFixed(1)}<hr style="border:none;border-top:1px solid #444;margin:4px 0"/>`;
    CONFIG.tooltipFields.forEach((f, i) => {
      if (d[f] !== undefined) {
        tooltipHtml += `${CONFIG.tooltipLabels[i]}: ${typeof d[f] === "number" ? d[f].toFixed(1) : d[f]}<br/>`;
      }
    });
    el.innerHTML = `
      <div class="item-name">${d.name}</div>
      <div class="item-code">${d.code} &middot; ${d.city}</div>
      <div class="score">${d[CONFIG.scoreField].toFixed(1)}</div>
      <div class="tooltip">${tooltipHtml}</div>
    `;
    itemsDiv.appendChild(el);
  });

  row.appendChild(itemsDiv);
  container.appendChild(row);
});

// Entrance animation
document.querySelectorAll(".tier-item").forEach((el, i) => {
  el.style.opacity = "0";
  el.style.transform = "translateY(10px)";
  setTimeout(() => {
    el.style.transition = "opacity 0.4s, transform 0.4s";
    el.style.opacity = "1";
    el.style.transform = "translateY(0)";
  }, 50 + i * 25);
});
</script>
