<script src="https://cdn.jsdelivr.net/npm/echarts@5/dist/echarts.min.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #0d1117; color: #e6edf3; }
  #chart { width: 100%; height: 92vh; min-height: 750px; }
  .header { padding: 24px 36px 8px; background: #161b22; border-bottom: 1px solid #30363d; }
  .header h1 { font-size: 1.4rem; color: #e6edf3; }
  .header p { font-size: 0.82rem; color: #8b949e; margin-top: 5px; }
  .nav { padding: 10px 36px; background: #161b22; display: flex; gap: 16px; font-size: 0.78rem; border-bottom: 1px solid #30363d; }
  .nav a { color: #58a6ff; text-decoration: none; }
  .nav a:hover { text-decoration: underline; }
</style>
</head>
<body>
<div class="header">
  <h1>Nap Metric Heatmap — 30 Countries × 5 Dimensions</h1>
  <p>Each cell shows the raw sub-score (0–10). Color intensity reflects relative performance within each metric column. Sorted by Nap Optimization Score (NOS).</p>
</div>
<div class="nav">
  <a href="index.html">Overview</a>
  <a href="chart.html">Primary Rankings</a>
  <a href="chart_matrix.html">Quadrant Analysis</a>
  <a href="chart_race.html">Weight Simulator</a>
</div>
<div id="chart"></div>
<script>
const DATA = [
  { name: "Spain",          SleepScore: 6.73, CultureScore: 8, WorkloadScore: 7.18, ClimateScore: 5.56, InfraScore: 7, NOS: 7.07,  rank: 1  },
  { name: "Netherlands",    SleepScore: 9.68, CultureScore: 4, WorkloadScore: 10.00, ClimateScore: 4.13, InfraScore: 8, NOS: 6.96, rank: 2  },
  { name: "Greece",         SleepScore: 6.53, CultureScore: 8, WorkloadScore: 3.89, ClimateScore: 5.72, InfraScore: 7, NOS: 6.39,  rank: 3  },
  { name: "France",         SleepScore: 8.63, CultureScore: 5, WorkloadScore: 7.76, ClimateScore: 4.62, InfraScore: 6, NOS: 6.37,  rank: 4  },
  { name: "Italy",          SleepScore: 6.53, CultureScore: 7, WorkloadScore: 6.16, ClimateScore: 5.05, InfraScore: 6, NOS: 6.30,  rank: 5  },
  { name: "Japan",          SleepScore: 0.00, CultureScore: 9, WorkloadScore: 7.63, ClimateScore: 4.54, InfraScore: 9, NOS: 6.26,  rank: 6  },
  { name: "Australia",      SleepScore: 9.26, CultureScore: 2, WorkloadScore: 7.53, ClimateScore: 8.79, InfraScore: 5, NOS: 6.03,  rank: 7  },
  { name: "Denmark",        SleepScore: 8.63, CultureScore: 3, WorkloadScore: 8.78, ClimateScore: 3.47, InfraScore: 7, NOS: 5.95,  rank: 8  },
  { name: "New Zealand",    SleepScore: 10.00,CultureScore: 3, WorkloadScore: 6.38, ClimateScore: 4.01, InfraScore: 7, NOS: 5.83,  rank: 9  },
  { name: "Germany",        SleepScore: 7.90, CultureScore: 3, WorkloadScore: 8.39, ClimateScore: 3.77, InfraScore: 7, NOS: 5.77,  rank: 10 },
  { name: "Norway",         SleepScore: 8.10, CultureScore: 3, WorkloadScore: 9.99, ClimateScore: 0.69, InfraScore: 7, NOS: 5.67,  rank: 11 },
  { name: "Finland",        SleepScore: 9.57, CultureScore: 3, WorkloadScore: 8.68, ClimateScore: 0.96, InfraScore: 6, NOS: 5.60,  rank: 12 },
  { name: "Portugal",       SleepScore: 7.05, CultureScore: 4, WorkloadScore: 6.40, ClimateScore: 6.19, InfraScore: 5, NOS: 5.57,  rank: 13 },
  { name: "Sweden",         SleepScore: 8.74, CultureScore: 3, WorkloadScore: 8.63, ClimateScore: 1.02, InfraScore: 6, NOS: 5.43,  rank: 14 },
  { name: "United Kingdom", SleepScore: 9.47, CultureScore: 2, WorkloadScore: 7.59, ClimateScore: 3.62, InfraScore: 5, NOS: 5.31,  rank: 15 },
  { name: "Taiwan",         SleepScore: 3.05, CultureScore: 6, WorkloadScore: 3.55, ClimateScore: 9.40, InfraScore: 4, NOS: 5.13,  rank: 16 },
  { name: "Mexico",         SleepScore: 4.74, CultureScore: 6, WorkloadScore: 2.42, ClimateScore: 8.48, InfraScore: 4, NOS: 5.10,  rank: 17 },
  { name: "Brazil",         SleepScore: 5.05, CultureScore: 4, WorkloadScore: 3.99, ClimateScore: 9.80, InfraScore: 4, NOS: 5.08,  rank: 18 },
  { name: "China",          SleepScore: 5.37, CultureScore: 9, WorkloadScore: 0.57, ClimateScore: 2.82, InfraScore: 5, NOS: 5.06,  rank: 19 },
  { name: "Colombia",       SleepScore: 4.74, CultureScore: 6, WorkloadScore: 1.75, ClimateScore: 9.89, InfraScore: 3, NOS: 5.03,  rank: 20 },
  { name: "Nigeria",        SleepScore: 6.10, CultureScore: 5, WorkloadScore: 3.23, ClimateScore: 9.09, InfraScore: 2, NOS: 5.03,  rank: 21 },
  { name: "Argentina",      SleepScore: 5.05, CultureScore: 4, WorkloadScore: 5.62, ClimateScore: 5.83, InfraScore: 4, NOS: 4.81,  rank: 22 },
  { name: "India",          SleepScore: 4.52, CultureScore: 6, WorkloadScore: 0.00, ClimateScore: 9.82, InfraScore: 3, NOS: 4.63,  rank: 23 },
  { name: "Thailand",       SleepScore: 5.26, CultureScore: 4, WorkloadScore: 1.85, ClimateScore: 9.32, InfraScore: 4, NOS: 4.62,  rank: 24 },
  { name: "Egypt",          SleepScore: 5.58, CultureScore: 5, WorkloadScore: 0.83, ClimateScore: 9.22, InfraScore: 2, NOS: 4.47,  rank: 25 },
  { name: "Canada",         SleepScore: 8.31, CultureScore: 2, WorkloadScore: 7.23, ClimateScore: 0.00, InfraScore: 5, NOS: 4.46,  rank: 26 },
  { name: "United States",  SleepScore: 7.79, CultureScore: 2, WorkloadScore: 4.93, ClimateScore: 3.05, InfraScore: 4, NOS: 4.20,  rank: 27 },
  { name: "Turkey",         SleepScore: 4.52, CultureScore: 4, WorkloadScore: 1.52, ClimateScore: 4.67, InfraScore: 4, NOS: 3.71,  rank: 28 },
  { name: "Singapore",      SleepScore: 4.42, CultureScore: 2, WorkloadScore: 0.55, ClimateScore: 8.88, InfraScore: 3, NOS: 3.38,  rank: 29 },
  { name: "South Korea",    SleepScore: 1.05, CultureScore: 2, WorkloadScore: 4.39, ClimateScore: 4.59, InfraScore: 4, NOS: 2.98,  rank: 30 },
];

const METRICS = ["SleepScore", "CultureScore", "WorkloadScore", "ClimateScore", "InfraScore"];
const METRIC_LABELS = ["Sleep (20%)", "Culture (30%)", "Work-Life (20%)", "Climate (15%)", "Infra (15%)"];

const sorted = [...DATA].sort((a, b) => b.NOS - a.NOS);
const names = sorted.map(d => `#${d.rank} ${d.name}`);

// Build heatmap data — normalize per column for color, keep raw for label
const ranges = {};
METRICS.forEach(m => {
  const vals = sorted.map(d => d[m]);
  ranges[m] = { min: Math.min(...vals), max: Math.max(...vals) };
});

const heatData = [];
sorted.forEach((d, yi) => {
  METRICS.forEach((m, xi) => {
    const raw = d[m];
    const { min, max } = ranges[m];
    const norm = max - min > 0 ? ((raw - min) / (max - min)) * 100 : 50;
    heatData.push([xi, yi, norm, raw]);
  });
});

const chart = echarts.init(document.getElementById("chart"), null, { renderer: "canvas" });
chart.setOption({
  backgroundColor: "#0d1117",
  tooltip: {
    position: "top",
    backgroundColor: "#161b22",
    borderColor: "#30363d",
    textStyle: { color: "#e6edf3", fontSize: 12 },
    formatter: p => {
      const d = sorted[p.value[1]];
      const metric = METRIC_LABELS[p.value[0]];
      return `<b>${d.name}</b><br/>${metric}: <b>${p.value[3].toFixed(1)}</b><br/>NOS: <b style="color:#FFD700">${d.NOS.toFixed(2)}</b>`;
    },
  },
  grid: { left: "19%", right: "6%", top: 80, bottom: 36 },
  xAxis: {
    type: "category",
    data: METRIC_LABELS,
    position: "top",
    axisLabel: { fontSize: 11, color: "#c9d1d9", rotate: 0, fontWeight: "600" },
    axisLine: { lineStyle: { color: "#30363d" } },
    splitArea: { show: true, areaStyle: { color: ["#161b22", "#0d1117"] } },
  },
  yAxis: {
    type: "category",
    data: names,
    inverse: false,
    axisLabel: { fontSize: 10, color: "#c9d1d9" },
    axisLine: { lineStyle: { color: "#30363d" } },
    splitArea: { show: true, areaStyle: { color: ["#0d1117", "#161b22"] } },
  },
  visualMap: {
    min: 0, max: 100, calculable: true,
    orient: "horizontal", left: "center", top: 14,
    inRange: {
      color: ["#1e3a5f", "#1a56a0", "#2980b9", "#52be80", "#f1c40f", "#e67e22", "#e74c3c"],
    },
    text: ["High", "Low"],
    textStyle: { fontSize: 10, color: "#8b949e" },
    itemWidth: 14, itemHeight: 140,
  },
  dataZoom: [{ type: "inside", yAxisIndex: 0, filterMode: "none" }],
  series: [{
    type: "heatmap",
    data: heatData,
    label: {
      show: true,
      formatter: p => {
        const raw = p.value[3];
        return typeof raw === "number" ? (raw % 1 === 0 ? raw : raw.toFixed(1)) : raw;
      },
      fontSize: 10,
      color: "#e6edf3",
    },
    emphasis: {
      itemStyle: { borderColor: "#fff", borderWidth: 2 },
    },
    animationDuration: 1600,
    animationEasing: "cubicOut",
  }],
  graphic: [
    { type: "text", right: 24, bottom: 10, style: { text: "RankMint", fontSize: 10, fill: "#30363d", fontStyle: "italic" } },
  ],
});
window.addEventListener("resize", () => chart.resize());
</script>
</body>
</html>
