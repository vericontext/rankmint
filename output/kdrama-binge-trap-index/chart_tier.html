const sorted = [...DATA].sort((a, b) => b.bts - a.bts);
const container = document.getElementById("tiers");

TIERS.forEach((tier, ti) => {
  const nextMin = TIERS[ti - 1] ? TIERS[ti - 1].min : Infinity;
  const items = sorted.filter(d => d.bts >= tier.min && d.bts < nextMin);

  const row = document.createElement("div");
  row.className = "tier-row";
  row.style.animationDelay = `${ti * 80}ms`;

  const labelDiv = document.createElement("div");
  labelDiv.className = "tier-label";
  labelDiv.style.background = `linear-gradient(160deg, ${tier.color} 0%, ${tier.color}aa 100%)`;
  if (tier.glow !== "none") {
    labelDiv.style.boxShadow = `inset -4px 0 20px ${tier.glow}`;
  }
  labelDiv.innerHTML = `${tier.label}<span class="tier-name">${tier.name}</span>`;

  const itemsDiv = document.createElement("div");
  itemsDiv.className = "tier-items";

  items.forEach((d, i) => {
    const el = document.createElement("div");
    el.className = "tier-item";
    el.style.animationDelay = `${ti * 80 + i * 30}ms`;
    el.style.borderColor = tier.color + "33";
    el.innerHTML = `
      ${d.name}
      <span class="item-score">${d.bts.toFixed(2)}</span>
      <div class="tooltip-box">
        <div class="t-label">${d.name}</div>

      </div>
    `;
    itemsDiv.appendChild(el);
  });

  if (items.length === 0) {
    itemsDiv.innerHTML = `<span style="color:#444;font-size:0.8rem;font-style:italic">No dramas in this tier</span>`;
  }

  row.appendChild(labelDiv);
