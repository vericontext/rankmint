<script>
const DATA = [

  { rank:9,  name:"Shanghai",     flag:"CN", region:"EAsia",   crvi:6.29, affordability:8.24, density:4.74,  quality:6.00,  variety:6.67,  embeddedness:5.00  },

  { rank:14, name:"Vancouver",    flag:"CA", region:"Western", crvi:4.71, affordability:2.94, density:4.21,  quality:6.00,  variety:6.67,  embeddedness:4.00  },
  { rank:15, name:"Manila",       flag:"PH", region:"SEAsia",  crvi:4.66, affordability:10.00,density:2.95,  quality:3.00,  variety:3.33,  embeddedness:2.00  },
  { rank:16, name:"Jakarta",      flag:"ID", region:"SEAsia",  crvi:4.66, affordability:10.00,density:2.95,  quality:3.00,  variety:3.33,  embeddedness:2.00  },
  { rank:17, name:"New York",     flag:"US", region:"Western", crvi:4.47, affordability:0.00, density:3.80,  quality:7.00,  variety:7.78,  embeddedness:5.00  },
  { rank:18, name:"Melbourne",    flag:"AU", region:"Western", crvi:4.37, affordability:3.53, density:3.88,  quality:5.00,  variety:5.56,  embeddedness:4.00  },

  { rank:20, name:"Toronto",      flag:"CA", region:"Western", crvi:4.14, affordability:3.53, density:3.47,  quality:5.00,  variety:5.56,  embeddedness:3.00  },
  { rank:21, name:"Sydney",       flag:"AU", region:"Western", crvi:3.85, affordability:2.35, density:3.47,  quality:5.00,  variety:5.56,  embeddedness:3.00  },
  { rank:22, name:"San Francisco",flag:"US", region:"Western", crvi:3.83, affordability:0.00, density:3.47,  quality:6.00,  variety:6.67,  embeddedness:4.00  },
  { rank:23, name:"Chicago",      flag:"US", region:"Western", crvi:3.74, affordability:2.35, density:2.95,  quality:5.00,  variety:5.56,  embeddedness:3.00  },
  { rank:24, name:"Paris",        flag:"FR", region:"Western", crvi:3.74, affordability:2.35, density:2.95,  quality:5.00,  variety:5.56,  embeddedness:3.00  },
  { rank:25, name:"Sao Paulo",    flag:"BR", region:"Other",   crvi:3.67, affordability:7.65, density:0.94,  quality:3.00,  variety:3.33,  embeddedness:2.00  },
  { rank:26, name:"Mexico City",  flag:"MX", region:"Other",   crvi:3.06, affordability:8.24, density:0.00,  quality:2.00,  variety:2.22,  embeddedness:1.00  },
  { rank:27, name:"London",       flag:"GB", region:"Western", crvi:3.04, affordability:0.00, density:2.38,  quality:5.00,  variety:5.56,  embeddedness:3.00  },
  { rank:28, name:"Dubai",        flag:"AE", region:"Other",   crvi:2.93, affordability:4.71, density:0.94,  quality:3.00,  variety:3.33,  embeddedness:2.00  },
  { rank:29, name:"Amsterdam",    flag:"NL", region:"Western", crvi:2.42, affordability:1.18, density:1.79,  quality:4.00,  variety:3.33,  embeddedness:2.00  },
  { rank:30, name:"Stockholm",    flag:"SE", region:"Western", crvi:2.34, affordability:2.35, density:0.94,  quality:3.00,  variety:3.33,  embeddedness:2.00  },
];

const REGION_COLORS = {
  "Japan":   "#E53935", "EAsia": "#FF9800",
  "SEAsia":  "#43A047", "Western": "#1E88E5", "Other": "#8E24AA",
};

const TIERS = [
  { label: "S", desc: "Pilgrimage-worthy",  min: 7.5,  color: "#FF4757", textColor: "#fff" },
  { label: "A", desc: "Excellent value",    min: 6.0,  color: "#FFA502", textColor: "#111" },
  { label: "B", desc: "Solid scene",        min: 5.0,  color: "#2ED573", textColor: "#111" },
  { label: "C", desc: "Worth exploring",    min: 4.0,  color: "#1E90FF", textColor: "#fff" },
  { label: "D", desc: "Manage expectations",min: 0,    color: "#747D8C", textColor: "#fff" },
];

const sorted = [...DATA].sort((a, b) => b.crvi - a.crvi);
const container = document.getElementById("tiers");

TIERS.forEach(tier => {
  const higherMins = TIERS.filter(t => t.min > tier.min).map(t => t.min);
  const tierMax = higherMins.length ? Math.min(...higherMins) : Infinity;
  const items = sorted.filter(d => d.crvi >= tier.min && d.crvi < tierMax);
  if (items.length === 0) return;

  const row = document.createElement("div");
  row.className = "tier-row";
  row.innerHTML = `
    <div class="tier-label" style="background:${tier.color};color:${tier.textColor}">
      ${tier.label}
      <span class="tier-range">${tier.desc}</span>
    </div>`;

  const itemsDiv = document.createElement("div");
  itemsDiv.className = "tier-items";

  items.forEach(d => {
    const dotColor = REGION_COLORS[d.region] || "#888";
    const el = document.createElement("div");
    el.className = "tier-item";
    el.innerHTML = `
      <div class="city-name">
        <span class="flag" style="display:inline-block;width:10px;height:10px;border-radius:50%;background:${dotColor};vertical-align:middle;margin-right:6px"></span>
        ${d.name}
      </div>
      <div class="score">CRVI ${d.crvi.toFixed(2)} &nbsp;&bull;&nbsp; #${d.rank}</div>
      <div class="tooltip-box">
        <b>${d.name}</b><br>
        <div class="tooltip-row"><span class="label">Affordability</span><span class="val">${d.affordability.toFixed(1)}</span></div>
        <div class="tooltip-row"><span class="label">Shop Density</span><span class="val">${d.density.toFixed(1)}</span></div>
        <div class="tooltip-row"><span class="label">Quality</span><span class="val">${d.quality.toFixed(1)}</span></div>
        <div class="tooltip-row"><span class="label">Variety</span><span class="val">${d.variety.toFixed(1)}</span></div>
        <div class="tooltip-row"><span class="label">Cultural Depth</span><span class="val">${d.embeddedness.toFixed(1)}</span></div>
      </div>
    `;
    itemsDiv.appendChild(el);
  });

  row.appendChild(itemsDiv);
  container.appendChild(row);
});

// Staggered entrance animation
document.querySelectorAll(".tier-item").forEach((el, i) => {
  el.style.opacity = "0";
  el.style.transform = "translateY(12px)";
  setTimeout(() => {
    el.style.transition = "opacity 0.4s, transform 0.4s";
    el.style.opacity = "1";
    el.style.transform = "translateY(0)";
  }, 60 + i * 35);
});
</script>
