<body>

<div class="header">
  <h1>Ramen City Head-to-Head — Radar Comparison</h1>
  <p>Compare any two cities across Affordability, Shop Density, Quality Ceiling, Style Variety, and Cultural Depth</p>
</div>
<div class="controls">
  <label>City 1</label>
  <select id="city1"></select>
  <div class="vs-label">vs</div>
  <label>City 2</label>
  <select id="city2"></select>
</div>
<div class="quick-picks">
  <span style="font-size:0.78rem;color:#555;line-height:28px;">Quick:</span>
  <button class="quick-btn" data-c1="Fukuoka" data-c2="Tokyo">Fukuoka vs Tokyo</button>
  <button class="quick-btn" data-c1="Bangkok" data-c2="New York">Bangkok vs New York</button>
  <button class="quick-btn" data-c1="Taipei" data-c2="London">Taipei vs London</button>
  <button class="quick-btn" data-c1="Fukuoka" data-c2="Bangkok">Fukuoka vs Bangkok</button>
  <button class="quick-btn" data-c1="New York" data-c2="London">New York vs London</button>
  <button class="quick-btn" data-c1="Osaka" data-c2="Seoul">Osaka vs Seoul</button>
</div>
<div class="scores-bar" id="scores-bar"></div>
<div id="chart"></div>

<script>
const DATA = [
  { name:"Fukuoka",      affordability:8.82, density:9.75,  quality:10.00, variety:7.78, embeddedness:10.00, crvi:9.21 },
  { name:"Tokyo",        affordability:7.65, density:10.00, quality:9.00,  variety:10.00, embeddedness:8.00,  crvi:8.91 },
  { name:"Osaka",        affordability:8.24, density:9.53,  quality:8.00,  variety:8.89,  embeddedness:7.00,  crvi:8.39 },
  { name:"Taipei",       affordability:8.82, density:6.59,  quality:9.00,  variety:8.89,  embeddedness:7.00,  crvi:8.15 },
  { name:"Sapporo",      affordability:8.24, density:8.09,  quality:7.00,  variety:6.67,  embeddedness:9.00,  crvi:7.76 },
  { name:"Seoul",        affordability:8.24, density:6.01,  quality:6.00,  variety:7.78,  embeddedness:8.00,  crvi:7.22 },
  { name:"Bangkok",      affordability:9.41, density:3.47,  quality:7.00,  variety:7.78,  embeddedness:6.00,  crvi:6.90 },
  { name:"Hong Kong",    affordability:7.06, density:5.15,  quality:7.00,  variety:7.78,  embeddedness:5.00,  crvi:6.50 },
  { name:"Shanghai",     affordability:8.24, density:4.74,  quality:6.00,  variety:6.67,  embeddedness:5.00,  crvi:6.29 },
  { name:"Singapore",    affordability:5.88, density:3.88,  quality:6.00,  variety:6.67,  embeddedness:4.00,  crvi:5.38 },
  { name:"Portland",     affordability:3.53, density:5.48,  quality:6.00,  variety:6.67,  embeddedness:5.00,  crvi:5.26 },
  { name:"Kuala Lumpur", affordability:9.41, density:3.47,  quality:4.00,  variety:4.44,  embeddedness:3.00,  crvi:5.18 },
  { name:"Los Angeles",  affordability:1.18, density:4.65,  quality:7.00,  variety:7.78,  embeddedness:5.00,  crvi:4.93 },
  { name:"Vancouver",    affordability:2.94, density:4.21,  quality:6.00,  variety:6.67,  embeddedness:4.00,  crvi:4.71 },
  { name:"Manila",       affordability:10.00,density:2.95,  quality:3.00,  variety:3.33,  embeddedness:2.00,  crvi:4.66 },
  { name:"Jakarta",      affordability:10.00,density:2.95,  quality:3.00,  variety:3.33,  embeddedness:2.00,  crvi:4.66 },
  { name:"New York",     affordability:0.00, density:3.80,  quality:7.00,  variety:7.78,  embeddedness:5.00,  crvi:4.47 },
  { name:"Melbourne",    affordability:3.53, density:3.88,  quality:5.00,  variety:5.56,  embeddedness:4.00,  crvi:4.37 },
  { name:"Berlin",       affordability:4.12, density:2.95,  quality:5.00,  variety:5.56,  embeddedness:3.00,  crvi:4.18 },
  { name:"Toronto",      affordability:3.53, density:3.47,  quality:5.00,  variety:5.56,  embeddedness:3.00,  crvi:4.14 },
  { name:"Sydney",       affordability:2.35, density:3.47,  quality:5.00,  variety:5.56,  embeddedness:3.00,  crvi:3.85 },
  { name:"San Francisco",affordability:0.00, density:3.47,  quality:6.00,  variety:6.67,  embeddedness:4.00,  crvi:3.83 },
  { name:"Chicago",      affordability:2.35, density:2.95,  quality:5.00,  variety:5.56,  embeddedness:3.00,  crvi:3.74 },
  { name:"Paris",        affordability:2.35, density:2.95,  quality:5.00,  variety:5.56,  embeddedness:3.00,  crvi:3.74 },
  { name:"Sao Paulo",    affordability:7.65, density:0.94,  quality:3.00,  variety:3.33,  embeddedness:2.00,  crvi:3.67 },
  { name:"Mexico City",  affordability:8.24, density:0.00,  quality:2.00,  variety:2.22,  embeddedness:1.00,  crvi:3.06 },
  { name:"London",       affordability:0.00, density:2.38,  quality:5.00,  variety:5.56,  embeddedness:3.00,  crvi:3.04 },
  { name:"Dubai",        affordability:4.71, density:0.94,  quality:3.00,  variety:3.33,  embeddedness:2.00,  crvi:2.93 },
  { name:"Amsterdam",    affordability:1.18, density:1.79,  quality:4.00,  variety:3.33,  embeddedness:2.00,  crvi:2.42 },
  { name:"Stockholm",    affordability:2.35, density:0.94,  quality:3.00,  variety:3.33,  embeddedness:2.00,  crvi:2.34 },
];

const METRICS = ["affordability","density","quality","variety","embeddedness"];
const METRIC_LABELS = ["Affordability","Shop Density","Quality Ceiling","Style Variety","Cultural Depth"];
const COLORS = ["#FF9800", "#5B8DEF"];

const sel1 = document.getElementById("city1");
const sel2 = document.getElementById("city2");

DATA.forEach((d, i) => {
  [sel1, sel2].forEach(sel => {
    const opt = document.createElement("option");
    opt.value = i; opt.textContent = d.name;
    sel.appendChild(opt);
  });
});
// Default: Fukuoka vs New York
sel1.value = 0;
sel2.value = 16;

const chart = echarts.init(document.getElementById("chart"));

function getMaxVals() {
  return METRICS.map(m => Math.max(10, Math.ceil(Math.max(...DATA.map(d => d[m])) * 1.05)));
}

function updateScores(d1, d2) {
  document.getElementById("scores-bar").innerHTML = `
    <div class="score-pill" style="border-left:3px solid ${COLORS[0]}">
      ${d1.name}: CRVI <span style="color:${COLORS[0]}">${d1.crvi.toFixed(2)}</span>
    </div>
    <div class="score-pill" style="border-left:3px solid ${COLORS[1]}">
      ${d2.name}: CRVI <span style="color:${COLORS[1]}">${d2.crvi.toFixed(2)}</span>
    </div>
  `;
}

function render() {
  const d1 = DATA[parseInt(sel1.value)];
  const d2 = DATA[parseInt(sel2.value)];
  updateScores(d1, d2);
  const maxVals = getMaxVals();
  chart.setOption({
    backgroundColor: "#0d0d1a",
    legend: {
      data: [d1.name, d2.name], top: 14,
      textStyle: { color: "#ccc", fontSize: 13 },
      itemWidth: 24, itemHeight: 3,
    },
    radar: {
      indicator: METRICS.map((m, i) => ({ name: METRIC_LABELS[i], max: maxVals[i] })),
      shape: "polygon",
      center: ["50%", "52%"],
      radius: "60%",
      splitArea: { areaStyle: { color: ["#1a1a2e", "#141428"] } },
      axisName: { color: "#9ca3af", fontSize: 12, fontWeight: 600 },
      splitLine: { lineStyle: { color: "#2d2d4e", width: 1 } },
      axisLine: { lineStyle: { color: "#2d2d4e" } },
    },
    tooltip: {
      trigger: "item",
      backgroundColor: "#1a1a2e",
      borderColor: "#333",
      textStyle: { color: "#e0e0e0" },
      formatter: p => {
        let tip = `<b>${p.name}</b>`;
        p.value.forEach((v, i) => {
          tip += `<br/>${METRIC_LABELS[i]}: <b>${v.toFixed(1)}</b>`;
        });
        return tip;
      },
    },
    series: [{
      type: "radar",
      data: [
        {
          name: d1.name,
          value: METRICS.map(m => d1[m]),
          areaStyle: { color: COLORS[0], opacity: 0.18 },
          lineStyle: { color: COLORS[0], width: 2.5 },
          itemStyle: { color: COLORS[0] },
          symbol: "circle", symbolSize: 6,
        },
        {
          name: d2.name,
          value: METRICS.map(m => d2[m]),
          areaStyle: { color: COLORS[1], opacity: 0.18 },
          lineStyle: { color: COLORS[1], width: 2.5 },
          itemStyle: { color: COLORS[1] },
          symbol: "circle", symbolSize: 6,
        },
      ],
      animationDuration: 1500,
      animationEasing: "cubicOut",
    }],
    graphic: [{
      type: "text", right: 20, bottom: 10,
      style: { text: "RankMint", fontSize: 12, fill: "#333", fontStyle: "italic" },
    }],
  });
}

sel1.addEventListener("change", render);
sel2.addEventListener("change", render);

document.querySelectorAll(".quick-btn").forEach(btn => {
  btn.addEventListener("click", () => {
    const c1 = btn.dataset.c1, c2 = btn.dataset.c2;
    const i1 = DATA.findIndex(d => d.name === c1);
    const i2 = DATA.findIndex(d => d.name === c2);
    if (i1 >= 0) sel1.value = i1;
    if (i2 >= 0) sel2.value = i2;
    render();
  });
});

render();
window.addEventListener("resize", () => chart.resize());
</script>
</body>
