const REGION_COLORS = {
  "Japan":    "#E53935",
  "East Asia":"#FF9800",
  "SE Asia":  "#43A047",
  "Western":  "#1E88E5",
  "Other":    "#8E24AA",
};

const sorted = [...DATA].sort((a, b) => a.crvi - b.crvi);
const names = sorted.map(d => d.name);
const barData = sorted.map(d => ({
  value: d.crvi,
  itemStyle: { color: REGION_COLORS[d.region] || "#888" },
  _raw: d,
}));

const chart = echarts.init(document.getElementById("chart"));
chart.setOption({
  backgroundColor: "#0d0d1a",
  tooltip: {
    trigger: "axis",
    axisPointer: { type: "shadow" },
    backgroundColor: "#1a1a2e",
    borderColor: "#333",
    textStyle: { color: "#e0e0e0", fontSize: 13 },
    formatter: params => {
      const d = sorted[params[0].dataIndex];
      return [
        `<b>${d.name}</b> <span style="color:#888">(${d.country})</span>`,
        `<span style="color:#FFD700">CRVI Score: ${d.crvi.toFixed(2)}</span>`,
        `<hr style="border-color:#333;margin:6px 0">`,
        `Affordability: ${d.affordability.toFixed(1)}`,
        `Shop Density: ${d.density.toFixed(1)}`,
        `Quality Ceiling: ${d.quality.toFixed(1)}`,
        `Style Variety: ${d.variety.toFixed(1)}`,
        `Cultural Depth: ${d.embeddedness.toFixed(1)}`,
      ].join("<br/>");
    },
  },
  grid: { left: "16%", right: "12%", top: 20, bottom: 30 },
  xAxis: {
    type: "value",
    max: 10,
    axisLabel: { color: "#888", fontSize: 11 },
    splitLine: { lineStyle: { color: "#1f1f35" } },
    axisLine: { lineStyle: { color: "#333" } },
  },
  yAxis: {
    type: "category",
    data: names,
    axisLabel: { color: "#ccc", fontSize: 12 },
    axisLine: { lineStyle: { color: "#333" } },
  },
  dataZoom: [
    { type: "inside", yAxisIndex: 0, filterMode: "none", zoomOnMouseWheel: true },
    { type: "slider", yAxisIndex: 0, width: 18, right: 4, backgroundColor: "#1a1a2e", fillerColor: "rgba(255,152,0,0.15)", borderColor: "#333" },
  ],
  series: [{
    type: "bar",
    data: barData,
    barWidth: "62%",
    label: {
      show: true,
      position: "right",
      formatter: p => p.value.toFixed(2),
      fontSize: 11,
      color: "#ccc",
    },
    animationDuration: 1800,
    animationEasing: "elasticOut",
  }],
  graphic: [
    { type: "text", right: 60, bottom: 10, style: { text: "RankMint", fontSize: 12, fill: "#444", fontStyle: "italic" } },
  ],
});

window.addEventListener("resize", () => chart.resize());
</script>
