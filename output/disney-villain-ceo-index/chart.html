  { rank:16, name: "Frollo",        film: "Hunchback of ND",       score: 52.2, sv: 7, rm: 7,  cp: 5, cm: 3, ia: 3, ei: 2, ri: 7  },
  { rank:17, name: "Maleficent",    film: "Sleeping Beauty",       score: 51.8, sv: 7, rm: 6,  cp: 5, cm: 2, ia: 6, ei: 2, ri: 6  },

// Berry palette: pink -> deep purple, top scores get pink, bottom get purple
function interpolateColor(c1, c2, t) {
  const hex = s => parseInt(s, 16);
  const r = Math.round(hex(c1.slice(1,3)) + (hex(c2.slice(1,3)) - hex(c1.slice(1,3))) * t);
  const g = Math.round(hex(c1.slice(3,5)) + (hex(c2.slice(3,5)) - hex(c1.slice(3,5))) * t);
  const b = Math.round(hex(c1.slice(5,7)) + (hex(c2.slice(5,7)) - hex(c1.slice(5,7))) * t);
  return `rgb(${r},${g},${b})`;
}

const sorted = [...DATA].sort((a, b) => b.score - a.score);
const names = sorted.map(d => d.name).reverse();
const scores = sorted.map(d => d.score).reverse();
const colors = scores.map((_, i) => interpolateColor("#4A148C", "#E91E63", i / Math.max(scores.length - 1, 1)));

const chart = echarts.init(document.getElementById("chart"), null, { renderer: "canvas" });
chart.setOption({
  backgroundColor: "#0f0f1e",
  tooltip: {
    trigger: "axis",
    axisPointer: { type: "shadow" },
    backgroundColor: "#1a1a2e",
    borderColor: "#333",
    textStyle: { color: "#eee", fontSize: 12 },
    formatter: params => {
      const idx = scores.length - 1 - params[0].dataIndex;
      const d = sorted[idx];
      return `<b style="font-size:13px;color:#E91E63">#${d.rank} ${d.name}</b>
<span style="color:#888;font-size:11px">${d.film}</span><br/>
<b style="color:#FFD700">CEO Score: ${d.score.toFixed(1)}</b><br/>
Strategic Vision: ${d.sv}/10<br/>
Resource Mgmt: ${d.rm}/10<br/>
Charisma: ${d.cp}/10<br/>
Crisis Mgmt: ${d.cm}/10<br/>
Innovation: ${d.ia}/10<br/>
Emotional IQ: ${d.ei}/10<br/>
Ruthlessness (adj): ${d.ri}/10`;
    }
  },
  grid: { left: "18%", right: "12%", top: 20, bottom: 40 },
  xAxis: {
    type: "value",
    name: "CEO Score",
    max: 100,
    axisLine: { lineStyle: { color: "#444" } },
    axisLabel: { color: "#888" },
    splitLine: { lineStyle: { color: "#222" } },
    nameTextStyle: { color: "#666" },
  },
  yAxis: {
    type: "category",
    data: names,
    axisLabel: { fontSize: 11, color: "#ccc" },
    axisLine: { lineStyle: { color: "#333" } },
  },
  dataZoom: [
    { type: "inside", yAxisIndex: 0, filterMode: "none" },
    { type: "slider", yAxisIndex: 0, right: 0, width: 14, borderColor: "#333",
      fillerColor: "rgba(233,30,99,0.15)", handleStyle: { color: "#e91e63" },
      textStyle: { color: "#666" }, filterMode: "none" },
  ],
  series: [{
    type: "bar",
    data: scores.map((v, i) => ({
      value: v,
      itemStyle: { color: colors[i], borderRadius: [0, 4, 4, 0] }
    })),
    barWidth: "55%",
    label: {
      show: true, position: "right",
      formatter: "{c}",
      fontSize: 10, color: "#aaa",
    },
    animationDuration: 1800,
    animationEasing: "elasticOut",
  }],
  graphic: [
    { type: "text", right: 6, bottom: 6,
      style: { text: "RankMint", fontSize: 11, fill: "#444", fontStyle: "italic" } },
  ],
});
window.addEventListener("resize", () => chart.resize());
</script>
