  .tier-item .boss-score { font-size: 0.7rem; color: #aaa; margin-top: 3px; font-weight: 700; }
  .tooltip-box {

<div class="watermark">RankMint</div>

  { rank: 14, name: "Sister Friede",     game: "Dark Souls 3",           score: 6.69, telegraph: 7, hitbox: 8, recovery: 6, learning: 7,  friction: 6, camera: 6, difficulty: 7  },
  { rank: 15, name: "Ornstein & Smough", game: "Dark Souls 1",           score: 6.62, telegraph: 7, hitbox: 7, recovery: 6, learning: 7,  friction: 5, camera: 7, difficulty: 8  },
  { rank: 16, name: "Ludwig",            game: "Bloodborne",             score: 6.57, telegraph: 7, hitbox: 7, recovery: 6, learning: 7,  friction: 5, camera: 6, difficulty: 7  },
  { rank: 17, name: "Radahn",            game: "Elden Ring",             score: 6.55, telegraph: 7, hitbox: 7, recovery: 6, learning: 6,  friction: 4, camera: 7, difficulty: 7  },

  { rank: 28, name: "Yellow Devil",      game: "Mega Man 1",             score: 3.20, telegraph: 2, hitbox: 6, recovery: 2, learning: 3,  friction: 9, camera: 7, difficulty: 7  },

  { rank: 30, name: "Bed of Chaos",      game: "Dark Souls 1",           score: 1.50, telegraph: 1, hitbox: 1, recovery: 2, learning: 2,  friction: 8, camera: 2, difficulty: 4  },
];

const TIERS = [
  { label: "S", desc: "Design Perfection", min: 7.5,  color: "#c0392b", textColor: "#fff" },
  { label: "A", desc: "Mostly Honest",     min: 6.5,  color: "#e67e22", textColor: "#fff" },
  { label: "B", desc: "Acceptable",        min: 5.0,  color: "#2980b9", textColor: "#fff" },
  { label: "C", desc: "Questionable",      min: 3.5,  color: "#8e44ad", textColor: "#fff" },
  { label: "D", desc: "Pure BS",           min: 0,    color: "#4a4a5a", textColor: "#ccc" },
];

const sorted = [...DATA].sort((a, b) => b.score - a.score);
const container = document.getElementById("tiers");

TIERS.forEach(tier => {
  const higherMins = TIERS.filter(t => t.min > tier.min).map(t => t.min);
  const nextMin = higherMins.length ? Math.min(...higherMins) : Infinity;
  const items = sorted.filter(d => d.score >= tier.min && d.score < nextMin);
  if (items.length === 0) return;

  const row = document.createElement("div");
  row.className = "tier-row";

  const label = document.createElement("div");
  label.className = "tier-label";
  label.style.background = tier.color;
  label.style.color = tier.textColor;
  label.innerHTML = `${tier.label}<div class="tier-desc">${tier.desc}</div>`;
  row.appendChild(label);

  const itemsDiv = document.createElement("div");
  itemsDiv.className = "tier-items";

  items.forEach(d => {
    const el = document.createElement("div");
    el.className = "tier-item";
    el.innerHTML = `
      <div class="boss-name">${d.name}</div>
      <div class="boss-game">${d.game}</div>
      <div class="boss-score">${d.score.toFixed(2)}</div>
      <div class="tooltip-box">
        <b>#${d.rank} ${d.name}</b><br/>
        <table>
          <tr><td>Telegraph Clarity</td><td>${d.telegraph}/10</td></tr>
          <tr><td>Hitbox Accuracy</td><td>${d.hitbox}/10</td></tr>
          <tr><td>Recovery Window</td><td>${d.recovery}/10</td></tr>
          <tr><td>Learning Curve</td><td>${d.learning}/10</td></tr>
          <tr><td>Retry Friction (raw)</td><td>${d.friction}/10</td></tr>
          <tr><td>Camera/Arena</td><td>${d.camera}/10</td></tr>
          <tr><td style="color:#aaa">Difficulty (community)</td><td style="color:#aaa">${d.difficulty}/10</td></tr>
        </table>
      </div>
    `;
    itemsDiv.appendChild(el);
  });

  row.appendChild(itemsDiv);
  container.appendChild(row);

  // Entrance animation
  const bosses = itemsDiv.querySelectorAll(".tier-item");
  bosses.forEach((el, i) => {
    el.style.opacity = "0";
    el.style.transform = "translateY(8px)";
    setTimeout(() => {
      el.style.transition = "opacity 0.35s, transform 0.35s";
      el.style.opacity = "1";
      el.style.transform = "translateY(0)";
    }, 80 + i * 35);
  });
});
</script>
